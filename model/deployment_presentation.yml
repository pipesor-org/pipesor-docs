  - id: deploy_environments_delivery
    title: "Entornos y entrega de imágenes"
    rankdir: TB
    wrap: 22
    summary: >-
      Flujo trunk-based definido en los repositorios hasta el entorno dev, y roots de Terraform de qa,
      preprod y prod, que solo tienen fundaciones. Lo que ningún documento ni código define se marca TBD
      con su motivo, sin proponer una estrategia.
    layout:
      ranks:
        - [d_branch, d_pr, d_squash, d_ci]
        - [d_apply, d_plan, d_images_pr, d_images_set, d_ghcr]
        - [d_dev, d_qa, d_preprod, d_prod]
      align:
        - [d_ci, d_images_set]
        - [d_apply, d_dev]
      loose: [d_rollback, d_ghcr_dev]
    groups:
      - id: g_service_repo
        kind: reading
        title: "Repositorio de cada servicio (GitHub)"
        note: "Pasos que ejecuta cada repositorio de servicio o del frontend."
      - id: g_iac_repo
        kind: reading
        title: "pipesor-iac"
        note: "Pasos del repositorio de IaC, dueño de las imágenes desplegadas."
      - id: g_environments
        kind: reading
        title: "Entornos (un root de Terraform cada uno)"
        note: "Roots de environments/; solo dev tiene workloads."
    nodes:
      - id: d_branch
        name: "rama feature/ o fix/ desde main"
        implementation_only: true
        category: platform
        group: g_service_repo
        state: implemented
        evidence:
          - iac:docs/adr-001-branching-and-promotion.md:36-38
          - ingestion:.github/workflows/ci.yml:3-6
        sources:
          - docs/development/cicd.md:12-14
      - id: d_pr
        name: "PR a main"
        implementation_only: true
        category: platform
        group: g_service_repo
        details: ["checks: conventions · build · assurance"]
        state: implemented
        evidence:
          - ingestion:.github/workflows/ci.yml:16-25
          - ci:.github/workflows/service-ci.yml:56-82
          - ci:.github/workflows/conventions.yml:111-133
        sources:
          - docs/development/cicd.md:28-31
      - id: d_squash
        name: "squash merge a main"
        implementation_only: true
        category: platform
        group: g_service_repo
        state: implemented
        evidence:
          - iac:docs/adr-001-branching-and-promotion.md:42-43
          - ci:.github/workflows/conventions.yml:135-137
        sources:
          - docs/development/cicd.md:28-34
      - id: d_ci
        name: "CI en main"
        implementation_only: true
        category: platform
        group: g_service_repo
        details: ["build · Trivy · publish", "candidate.json (90 días)"]
        state: implemented
        evidence:
          - ingestion:.github/workflows/ci.yml:7-8
          - ci:.github/workflows/service-ci.yml:84-92
          - ci:.github/workflows/container-build.yml:107-109
          - ci:.github/workflows/image-assurance.yml:23
          - ci:.github/workflows/image-assurance.yml:63-81
          - ci:.github/workflows/publish-container.yml:93-131
      - id: d_ghcr
        name: "GHCR"
        implementation_only: true
        category: external
        details: ["paquete privado · imagen por digest"]
        state: implemented
        evidence:
          - ci:.github/workflows/publish-container.yml:50-91
          - iac:environments/dev/images.json:6-7
      - id: d_images_set
        name: "tools/images.js set dev"
        implementation_only: true
        category: platform
        group: g_iac_repo
        details: ["candidato de un push a main con éxito"]
        state: implemented
        evidence:
          - iac:tools/images.js:66-79
          - iac:tools/images.js:155-163
      - id: d_images_pr
        name: "PR a dev/images.json"
        implementation_only: true
        category: platform
        group: g_iac_repo
        details: ["CI valida el archivo · merge"]
        state: implemented
        evidence:
          - iac:docs/dev-runtime-deployment.md:157-160
          - iac:environments/dev/main.tf:75-81
          - iac:tests/images.test.js:22-29
      - id: d_plan
        name: "plan nuevo desde main"
        implementation_only: true
        category: platform
        group: g_iac_repo
        details: ["el CI de IaC no planifica"]
        state: implemented
        evidence:
          - iac:docs/adr-001-branching-and-promotion.md:85-90
          - iac:docs/dev-runtime-deployment.md:159-160
          - iac:.github/workflows/ci.yml:67-71
      - id: d_apply
        name: "apply manual del operador"
        implementation_only: true
        category: platform
        group: g_iac_repo
        details: ["plan revisado · autorización explícita"]
        state: implemented
        evidence:
          - iac:docs/dev-runtime-deployment.md:7
          - iac:docs/dev-runtime-deployment.md:159-161
          - iac:docs/adr-001-branching-and-promotion.md:103
      - id: d_dev
        name: "dev"
        implementation_only: true
        category: prototype
        group: g_environments
        details: ["8 Container Apps Healthy", "digests de images.json"]
        state: deployed
        observation: container_apps
        model_fact: deployment.mvp_preparation.active_environment
        evidence:
          - iac:environments/dev/main.tf:75-117
          - iac:environments/dev/images.json:1-62
      - id: d_qa
        name: "qa"
        implementation_only: true
        category: prototype
        group: g_environments
        details: ["solo fundaciones · sin workloads"]
        state: proposed
        model_fact: deployment.mvp_preparation.preserved_environment_roots
        evidence:
          - iac:environments/qa/main.tf:1-73
          - iac:environments/qa/terraform.tfvars.example:1-6
          - iac:README.md:25
      - id: d_preprod
        name: "preprod"
        implementation_only: true
        category: prototype
        group: g_environments
        details: ["solo fundaciones · sin workloads"]
        state: proposed
        model_fact: deployment.mvp_preparation.preserved_environment_roots
        evidence:
          - iac:environments/preprod/main.tf:1-73
          - iac:environments/preprod/terraform.tfvars.example:1-6
          - iac:README.md:25
      - id: d_prod
        name: "prod"
        implementation_only: true
        category: prototype
        group: g_environments
        details: ["solo fundaciones · sin workloads"]
        state: proposed
        model_fact: deployment.mvp_preparation.preserved_environment_roots
        evidence:
          - iac:environments/prod/main.tf:1-73
          - iac:environments/prod/terraform.tfvars.example:1-6
          - iac:README.md:25
      - id: t_gates
        name: "gates entre entornos"
        state: tbd
        reason: "Los Environments con revisores de qa, preprod y prod están por configurar; no hay gate definido."
        evidence:
          - iac:docs/adr-001-branching-and-promotion.md:31-32
        sources:
          - docs/development/cicd.md:180
          - docs/development/cicd.md:249-251
      - id: t_releases
        name: "releases y tags SemVer"
        state: tbd
        reason: "release.yml está deshabilitado en el código (if: false) y stable exige una validación preprod que no existe."
        evidence:
          - ingestion:.github/workflows/release.yml:44-45
          - ci:README.md:80-81
        sources:
          - docs/development/cicd.md:107-110
      - id: t_auto_deploy
        name: "despliegue automático a dev"
        state: tbd
        reason: "La plantilla terraform-dev.yml.example es un andamiaje inactivo (if: ${{ false }}) con un runner propuesto."
        evidence:
          - iac:.github/workflow-templates/terraform-dev.yml.example:1-3
          - iac:.github/workflow-templates/terraform-dev.yml.example:45-48
        sources:
          - docs/development/cicd.md:152-154
      - id: t_approvals
        name: "aprobaciones de PR y CODEOWNERS"
        state: tbd
        reason: "Los rulesets no exigen aprobaciones mínimas y ningún repositorio tiene CODEOWNERS."
        sources:
          - docs/development/cicd.md:28-30
      - id: t_order
        name: "orden de despliegue entre repositorios"
        state: tbd
        reason: "PD-035 no especifica el contrato de entrega backend–IaC (artefactos, migraciones, promoción)."
        sources:
          - docs/architecture/pending-decisions.md:226
      - id: t_record
        name: "registro de despliegue (IaC ADR 001)"
        state: tbd
        reason: "ADR 001 pide SHA, digest del plan, aprobadores y timestamps; en Git solo queda el historial de images.json."
        evidence:
          - iac:docs/adr-001-branching-and-promotion.md:105-110
          - iac:docs/dev-runtime-deployment.md:157-159
    edges:
      - id: d_branch_pr
        from: d_branch
        to: d_pr
        label: "PR"
        description: "Cada cambio entra por un PR a main que dispara el CI del repositorio."
        state: implemented
        evidence:
          - ingestion:.github/workflows/ci.yml:3-6
      - id: d_pr_squash
        from: d_pr
        to: d_squash
        label: "checks en verde"
        description: "conventions, build y assurance del CI compartido; su obligatoriedad está en los rulesets de GitHub."
        state: implemented
        evidence:
          - ci:.github/workflows/service-ci.yml:56-82
      - id: d_squash_ci
        from: d_squash
        to: d_ci
        label: "push a main"
        description: "El push a main vuelve a verificar el commit integrado y habilita la publicación."
        state: implemented
        evidence:
          - ingestion:.github/workflows/ci.yml:7-8
          - ci:.github/workflows/service-ci.yml:84-86
      - id: d_ci_ghcr
        from: d_ci
        to: d_ghcr
        label: "push sin reconstruir"
        description: "Publica el archivo ya verificado y comprueba que el paquete sea privado."
        state: implemented
        evidence:
          - ci:.github/workflows/publish-container.yml:50-91
      - id: d_ci_images_set
        from: d_ci
        to: d_images_set
        label: "candidate.json"
        description: "images.js descarga el candidate.json del run y verifica que sea un push a main de ci.yml con éxito."
        state: implemented
        evidence:
          - ci:.github/workflows/publish-container.yml:125-131
          - iac:tools/images.js:112-131
      - id: d_set_pr
        from: d_images_set
        to: d_images_pr
        label: "cambia la entrada"
        description: "set reescribe la entrada del workload e indica abrir un PR."
        state: implemented
        evidence:
          - iac:tools/images.js:155-163
      - id: d_pr_plan
        from: d_images_pr
        to: d_plan
        label: "tras el merge"
        description: "Después del merge se genera un plan nuevo desde main."
        state: implemented
        evidence:
          - iac:docs/dev-runtime-deployment.md:157-160
      - id: d_plan_apply
        from: d_plan
        to: d_apply
        label: "revisión humana"
        description: "Se revisa el plan guardado y se autoriza ese apply concreto."
        state: implemented
        evidence:
          - iac:docs/adr-001-branching-and-promotion.md:85-93
      - id: d_apply_dev
        from: d_apply
        to: d_dev
        label: "apply"
        description: "Se aplica solo el plan revisado sobre el root dev."
        state: implemented
        evidence:
          - iac:docs/dev-runtime-deployment.md:159-161
      - id: d_ghcr_dev
        from: d_ghcr
        to: d_dev
        label: "imagen por digest"
        description: "Las Container Apps de dev ejecutan los digests de images.json (observación del 27/11)."
        state: deployed
        observation: container_apps
        evidence:
          - iac:environments/dev/main.tf:75-81
      - id: d_rollback
        from: d_dev
        to: d_images_pr
        label: "rollback: restaura la entrada anterior"
        description: >-
          Un PR que restaura la entrada anterior de images.json y un plan nuevo revisado; no hay downgrade
          SQL implícito. No consta en Git una ejecución de rollback.
        state: implemented
        evidence:
          - iac:docs/dev-runtime-deployment.md:161-162
        sources:
          - docs/development/cicd.md:145-147
      - id: d_dev_qa
        from: d_dev
        to: d_qa
        label: "mismo digest"
        description: >-
          Promoción declarada: el mismo digest en el root siguiente (images.js promote). Hoy fallaría:
          qa no tiene images.json y readDocument lo exige.
        state: proposed
        evidence:
          - iac:docs/adr-001-branching-and-promotion.md:57-64
          - iac:tools/images.js:90-96
          - iac:tools/images.js:164-170
      - id: d_qa_preprod
        from: d_qa
        to: d_preprod
        label: "mismo digest"
        description: "Promoción declarada de qa a preprod tras verificar en qa y la aprobación independiente de QA."
        state: proposed
        evidence:
          - iac:docs/adr-001-branching-and-promotion.md:63
      - id: d_preprod_prod
        from: d_preprod
        to: d_prod
        label: "mismo digest"
        description: "Promoción declarada de preprod a prod tras verificar en preprod y la aprobación de producción."
        state: proposed
        evidence:
          - iac:docs/adr-001-branching-and-promotion.md:64
    notes:
      - id: n_authorization_divergence
        attach_to: d_dev
        lines:
          - "architecture.yml: deployment_authorized: false (ADR-019)"
          - "frente a: dev desplegado (observado 27/11)"
        model_fact: deployment.mvp_preparation.deployment_authorized
        expected: false
        observation: container_apps
        sources:
          - docs/architecture/decisions/ADR-019-align-mvp-with-iac.md:79-84
    not_drawn:
      - name: "Retención semanal de GHCR"
        state: implemented
        reason: "Protege el digest actual y 3 anteriores de cada images.json; funciona en dry-run hasta REGISTRY_RETENTION_DELETE=true."
        evidence:
          - ci:README.md:83-90
          - ci:README.md:126-129
      - name: "CI de pipesor-iac"
        state: implemented
        reason: "Valida formato, roots, módulos e images.json sin credenciales ni backend; no hace plan real."
        evidence:
          - iac:.github/workflows/ci.yml:39-97
