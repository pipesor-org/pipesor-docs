# Vistas de despliegue de Pipesor para la Memoria de Tesis y el Capstone (A4).
#
# Autorizado por el responsable el 27/11/2026 (decisiones 1 y 7 de la fase 2 de la auditoría de
# diagramas): modelo de presentación nuevo con generador, validador y pruebas. Cada nodo, grupo o
# arista cita un elemento o una relación existentes de model/architecture.yml, o evidencia
# repo:ruta:línea de las revisiones fijadas en model/implementation_status.yml, con su estado. Lo
# implementado que el modelo no tiene se marca como «implementación no modelada» y NO se añade a
# architecture.yml. Sobre ramas y entrega: solo se dibuja lo definido y el resto se marca TBD, sin
# proponer una estrategia.
#
# El estado «deployed» procede solo de la observación de solo lectura del 27/11/2026 22:07Z
# (decisión 7; implementation_status.yml → deployment_observation). No es una aprobación:
# deployment.mvp_preparation.deployment_authorized sigue en false en architecture.yml (ADR-019) y
# este modelo lo muestra como divergencia, sin cambiarlo.
#
# Generador: tools/generators/deployment.py. Salidas: build/deploy_*.dot, out/deploy_*.svg y
# out/despliegue_guia.md.
model_version: "1.0.0"
architecture_source: model/architecture.yml
overlay_source: model/implementation_status.yml
purpose: "Memoria de Tesis y Capstone: despliegue del entorno dev y entrega entre entornos"
authorization:
  date: "2026-11-27"
  decisions: [1, 7]
  scope: >-
    Modelo de presentación con generador, validador y pruebas; citas a architecture.yml o a evidencia
    repo:ruta:línea con estado; lo implementado no modelado se marca sin añadirlo al modelo; ramas:
    solo lo definido y el resto TBD, sin proponer una estrategia.
max_nodes_per_figure: 22

# Hechos que el dibujo usa o menciona y que no tienen evidencia repo:ruta:línea; la guía los lista.
evidence_limits:
  - "La obligatoriedad de los checks conventions, build y assurance, el merge solo por squash y las cero aprobaciones mínimas son rulesets de GitHub, fuera de Git; solo se cita el CI que los produce y la guía de CI/CD."
  - "La ausencia de CODEOWNERS no se puede citar con una línea: es una ausencia comprobada en la auditoría del 27/11."
  - "Quién fusiona el PR de images.json y desde dónde se ejecuta el apply constan en notas de traspaso fuera de Git; la figura solo dice «apply manual del operador» con autorización explícita, como el runbook."
  - "Los tfvars privados de dev (workloads, webhook, deployments reales de Foundry, lectores de Key Vault) no se leyeron; se cita el ejemplo versionado. Que el webhook esté activo no se observó el 27/11."
  - "La observación del 27/11 no incluyó la red, el Container Apps Environment, Key Vault, Foundry, Log Analytics, las identidades ni GHCR: van como implementados."

# Vocabulario de estado de nodos, grupos y aristas (el generador fija el estilo de cada uno).
states:
  deployed: "Desplegado: observado en Azure el 27/11/2026 (observación de solo lectura)."
  implemented: "Implementado en IaC o código, pero no observado el 27/11 o no activo."
  proposed: "Propuesto: declarado en documentos o en roots de Terraform sin workloads."
  tbd: "No definido (TBD): ni implementado ni decidido; lleva el motivo."

