      - section: "Authorization at GitHub"
      - message:
          from: browser
          to: gh
          style: sync
          text: "GET /login/oauth/authorize"
          implementation_only: true
          reason: "Navegación del navegador tras el 302 de Ingestion."
          state: implemented
          note: "rel_dashboard_github_sign_in draws Dashboard → GitHub; in code this redirect from Ingestion realises it."
          evidence:
            - ingestion:src/main/java/org/pipesor/ingestion/auth/infrastructure/github/GitHubAuthorizeUrls.java:22-26
      - message:
          from: user
          to: gh
