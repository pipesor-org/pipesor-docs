  # ---------------------------------------------------------------------------------------------
  - id: seq_b_login
    title: "GitHub sign-in with recorded consent, PKCE and Pipesor session token"
    purpose: >-
      Inicio de sesión: el navegador parte del dashboard hacia Ingestion con la versión de los
      documentos aceptados; Ingestion custodia el verifier PKCE en Key Vault, redirige a GitHub,
      consume el callback una sola vez, canjea el código, verifica la identidad, activa la conexión y
      registra handoff y consentimiento; el dashboard canjea el handoff por un JWT firmado en Key
      Vault que Pipeline y Recommendation validan con el JWKS de Ingestion.
    participants:
      - {id: user, name: "Technical user", element: technical_users}
      - id: browser
        name: "Browser"
        implementation_only: true
        kind: "Agente de usuario que sigue las redirecciones 302 entre Ingestion, GitHub y el dashboard"
        evidence:
          - frontend:src/entities/session/model/session.ts:135-144
          - ingestion:src/main/java/org/pipesor/ingestion/auth/interfaces/rest/AuthController.java:169-172
      - {id: spa, name: "AIOps Web Dashboard", element: web_dashboard}
      - {id: ing, name: "Ingestion", element: ingestion_normalization_service}
      - {id: kv, name: "Azure Key Vault", element: azure_key_vault}
      - {id: pg, name: "PostgreSQL", element: postgresql_operational_store}
      - {id: gh, name: "GitHub", element: github}
      - {id: pip, name: "Pipeline", element: pipeline_service}
      - {id: rec, name: "Recommendation", element: recommendation_service}
    untested:
      - "Frontend sin E2E ni pruebas de session.ts, SignInPage, AuthCompletePage, RequireSession o de los manejadores de 401 de client.ts."
      - "Ninguna prueba recorre SPA → Ingestion → GitHub → callback → canje → Pipeline: los tests de flujo usan GitHub sintético, custodia en fichero y firma PEM."
      - "Ninguna prueba valida un token de Ingestion contra su JWKS real desde otro servicio."
      - "Sin prueba: logout HTTP con sesión válida, consent_required en el callback, fallo de Key Vault tras consumir el handoff, 503 en start, estado del vínculo tras fallar el consentimiento, rotación de claves y rate limit."
    steps:
      - section: "Start with recorded consent"
      - message:
          from: user
          to: spa
          style: sync
          text: "Tick the consent box and press Continue on /login"
          relationship: rel_technical_users_dashboard
          state: implemented
          evidence:
            - frontend:src/pages/sign-in/ui/SignInPage.tsx:77-97
            - frontend:src/pages/sign-in/ui/SignInPage.tsx:106-116
            - frontend:src/shared/config/legal.ts:7
      - message:
          from: spa
          to: ing
          style: sync
          text: "Full-page GET /api/v1/auth/github/start?return_to=...&consent_version=YYYY-MM-DD"
          relationship: rel_dashboard_ingestion_github_connection
          state: implemented
          evidence:
            - frontend:src/entities/session/model/session.ts:135-144
            - frontend:src/shared/config/navigation.ts:192-202
            - ingestion:src/main/java/org/pipesor/ingestion/auth/interfaces/rest/AuthController.java:84-108
      - fragment:
          kind: alt
          label: "start rejected"
          branches:
            - guard: "consent_version missing, malformed, repeated or later than tomorrow (UTC)"
              steps:
                - message:
                    from: ing
                    to: spa
                    style: reply
                    text: "302 error=consent_required: no attempt, no custody, no GitHub call"
                    relationship: rel_dashboard_ingestion_github_connection
                    state: implemented
                    evidence:
                      - ingestion:src/main/java/org/pipesor/ingestion/auth/application/commandhandlers/GitHubLoginHandler.java:201-208
                      - ingestion:src/main/java/org/pipesor/ingestion/auth/interfaces/rest/AuthController.java:103-107
            - guard: "return_to not allowed"
              steps:
                - message:
                    from: ing
                    to: spa
                    style: reply
                    text: "400 INVALID_REQUEST as JSON, without a redirect"
                    relationship: rel_dashboard_ingestion_github_connection
                    state: implemented
                    evidence:
                      - ingestion:src/main/java/org/pipesor/ingestion/auth/application/commandhandlers/GitHubLoginHandler.java:84-86
                      - ingestion:src/main/java/org/pipesor/ingestion/shared/interfaces/rest/ApiExceptionHandler.java:68
      - section: "Login attempt, state and PKCE custody"
      - message:
          from: ing
          to: ing
          style: self
          text: "state of 32 bytes, PKCE verifier of 64 bytes, S256 challenge"
          implementation_only: true
          reason: "Paso interno de Ingestion, no modelado."
          state: implemented
          evidence:
            - ingestion:src/main/java/org/pipesor/ingestion/auth/application/commandhandlers/GitHubLoginHandler.java:80-99
      - message:
          from: ing
          to: kv
          style: sync
          text: "setSecret github-pkce-<attemptId> in the custody vault"
          relationship: rel_ingestion_key_vault
          state: implemented
          note: "The secret is never deleted (ingestion issue 24, open)."
          evidence:
            - ingestion:src/main/java/org/pipesor/ingestion/github/infrastructure/custody/KeyVaultCredentialCustody.java:65-76
            - ingestion:src/main/java/org/pipesor/ingestion/github/infrastructure/custody/KeyVaultCredentialCustody.java:24-27
            - iac:modules/workloads/main.tf:108
