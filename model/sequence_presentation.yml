  # ---------------------------------------------------------------------------------------------
  - id: seq_a2_diagnosis
    title: "Assisted diagnosis: job, RAG retrieval, Azure OpenAI inference and summary projection"
    purpose: >-
      Segunda mitad del flujo: el recibo de Correlation deja un job durable; un worker lo reclama,
      comprueba el replay, recupera conocimiento por RAG, pide la hipótesis a Azure OpenAI con salida
      estricta, valida las citas, persiste el diagnóstico y el outbox en una transacción y un segundo
      worker proyecta el resumen en Pipeline.
    participants:
      - {id: cor, name: "Correlation", element: evidence_correlation_engine}
      - {id: api, name: "Diagnostic API", element: diagnostic_api_component}
      - id: worker
        name: "Diagnosis worker"
        implementation_only: true
        parent: recommendation_service
        kind: "Hilo por réplica que sondea diagnosis_jobs cada 5 s (DiagnosisWorker)"
        evidence:
          - recommendation:src/main/java/com/pipesor/recommendation/diagnosis/infrastructure/DiagnosisWorker.java:39-52
          - recommendation:src/main/java/com/pipesor/recommendation/diagnosis/application/commandhandlers/DiagnoseAdmittedContextsHandler.java:60-64
      - {id: orch, name: "Diagnostic Orchestrator", element: diagnostic_orchestrator_component}
      - {id: rag, name: "RAG Retrieval", element: rag_retrieval}
      - {id: aoai, name: "Azure OpenAI", element: pretrained_llm_diagnostic_service}
      - {id: vec, name: "pgvector", element: pgvector_knowledge_store}
      - {id: pg, name: "PostgreSQL", element: postgresql_operational_store}
      - id: outbox
        name: "Summary outbox worker"
        implementation_only: true
        parent: recommendation_service
        kind: "Worker del outbox incident_summary_outbox que sondea cada 2 s (DiagnosisSummaryWorker)"
        evidence:
          - recommendation:src/main/java/com/pipesor/recommendation/diagnosis/infrastructure/DiagnosisSummaryWorker.java:39-52
          - recommendation:src/main/java/com/pipesor/recommendation/diagnosis/application/commandhandlers/PublishDiagnosisSummariesHandler.java:48-50
      - {id: pip, name: "Pipeline", element: pipeline_service}
    untested:
      - "Ningún test cruza servicios: en RecommendationApiTest la inferencia es un bean sustituto y RAG responde siempre no_match, así que el camino con fragmentos y fuentes no se recorre integrado."
      - "Pipeline es un HttpServer falso para entitlements y resúmenes; la coherencia del contrato depende de fixtures espejo."
      - "Sin prueba: timeout real del LLM, content_filter, prompt mayor de 128 KiB, reintentos del job por fallos del LLM, RAG 401 y 422 explícitos, invalid_context, admission_conflict y el bucle indefinido del outbox con 404 o 401."
      - "Embeddings solo con cliente falso; pgvector solo con embeddings deterministas. Nunca contra Azure OpenAI real."
    steps:
      - section: "Admission of the correlated context"
      - message:
          from: cor
          to: api
          style: sync
          text: "POST /internal/v1/correlated-contexts (workload token, Idempotency-Key, X-Correlation-ID; 256 KiB maximum)"
          relationship: rel_correlation_diagnostic_api
          state: implemented
          evidence:
            - recommendation:src/main/java/com/pipesor/recommendation/configuration/RecommendationRoutes.java:22-23
            - recommendation:src/main/java/com/pipesor/recommendation/receipt/interfaces/rest/CorrelatedContextController.java:41-75
            - recommendation:src/main/java/com/pipesor/recommendation/receipt/ReceiptJson.java:37-104
      - message:
          from: api
          to: pg
          style: sync
          text: "Receipt ON CONFLICT DO NOTHING and diagnosis_jobs PENDING in the same transaction"
          relationship: rel_recommendation_service_postgresql
          state: implemented
          idempotency: "PK operation_id = context_id; a job only when the receipt is inserted; other fingerprint: 409"
          evidence:
            - recommendation:src/main/java/com/pipesor/recommendation/receipt/ReceiptStore.java:20-87
            - recommendation:src/main/resources/db/migration/V1__create_correlated_context_receipts.sql:4-30
            - recommendation:src/main/resources/db/migration/V7__create_diagnosis_jobs.sql:4-13
      - message:
          from: api
          to: cor
          style: reply
          text: "200 accepted | duplicate (a duplicate does not revive a FAILED job)"
          relationship: rel_correlation_diagnostic_api
          state: implemented
          evidence:
            - recommendation:src/main/java/com/pipesor/recommendation/receipt/ReceiptStore.java:56-77
      - message:
          from: api
          to: worker
          style: async
          text: "Job PENDING in the durable queue diagnosis_jobs"
          relationship: rel_diagnostic_api_orchestrator
          state: divergent
          note: "Modelled as an in-process synchronous delegation from the API to the orchestrator; in code a worker drives the orchestrator from diagnosis_jobs. Reconciliation question 13 is open."
          evidence:
            - recommendation:src/main/java/com/pipesor/recommendation/receipt/ReceiptStore.java:56-63
            - recommendation:src/main/java/com/pipesor/recommendation/diagnosis/infrastructure/DiagnosisWorker.java:39-52

      - section: "Claim and replay check"
      - message:
          from: worker
          to: pg
          style: sync
          text: "Claim jobs: FOR UPDATE SKIP LOCKED, attempts + 1, lease 10 min"
          relationship: rel_recommendation_service_postgresql
          state: implemented
          idempotency: "Settlement (DONE, retry or FAILED) only WHERE attempts = the claimed value"
          evidence:
            - recommendation:src/main/java/com/pipesor/recommendation/diagnosis/infrastructure/persistence/JdbcDiagnosisJobs.java:24-42
            - recommendation:src/main/resources/application.yml:66-73
      - message:
          from: worker
          to: pg
          style: sync
          text: "Rebuild the input from the receipt only (ordered signals, query of 4000 characters or fewer, top 3)"
          relationship: rel_recommendation_service_postgresql
          state: implemented
          evidence:
            - recommendation:src/main/java/com/pipesor/recommendation/diagnosis/infrastructure/persistence/JdbcAdmittedContexts.java:25-47
            - recommendation:src/main/java/com/pipesor/recommendation/diagnosis/application/ContextReconstruction.java:32-56
      - message:
          from: worker
          to: pg
          style: sync
          text: "Look up diagnosis UUIDv3(contextId) and its admission_fingerprint"
          relationship: rel_recommendation_service_postgresql
          state: implemented
          evidence:
            - recommendation:src/main/java/com/pipesor/recommendation/diagnosis/review/PersistedDiagnosticWorkflow.java:34-49
            - recommendation:src/main/java/com/pipesor/recommendation/diagnosis/review/ReviewStore.java:45-63
      - fragment:
          kind: opt
          label: "replay"
          branches:
            - guard: "diagnosis already admitted with the same fingerprint"
              steps:
                - message:
                    from: worker
                    to: pg
                    style: sync
                    text: "Job DONE with the existing diagnosis, without RAG or LLM"
                    relationship: rel_recommendation_service_postgresql
                    state: implemented
                    idempotency: "admission_fingerprint = SHA-256 of execution, incident, query and evidence"
                    evidence:
                      - recommendation:src/main/java/com/pipesor/recommendation/diagnosis/review/PersistedDiagnosticWorkflow.java:36-37
                      - recommendation:src/main/java/com/pipesor/recommendation/diagnosis/application/commandhandlers/DiagnoseAdmittedContextsHandler.java:75-77
      - message:
          from: worker
          to: orch
          style: sync
