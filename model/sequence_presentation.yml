  - id: seq_a3_review
    title: "Human review and diagnosis report: dashboard, Pipeline entitlement and GitHub Actions artifact"
    purpose: >-
      Consumo del diagnóstico: el dashboard lee la cola de incidentes de Pipeline y el diagnóstico de
      Recommendation, que resuelve el permiso en Pipeline con el token de sujeto; la persona registra
      la revisión con control de concurrencia e idempotencia, el outbox la reproyecta en Pipeline y el
      workflow del repositorio monitorizado consulta el informe por OIDC y lo adjunta como artifact.
    participants:
      - {id: user, name: "Technical user", element: technical_users}
      - {id: dash, name: "AIOps Web Dashboard", element: web_dashboard}
      - {id: pip, name: "Pipeline", element: pipeline_service}
      - {id: rec, name: "Recommendation", element: recommendation_service}
      - {id: pg, name: "PostgreSQL", element: postgresql_operational_store}
      - {id: gha, name: "GitHub Actions", element: github_actions}
    untested:
      - "Frontend sin pruebas de entities/diagnosis/model/api.ts, DiagnosisReview.tsx ni del espacio de trabajo del incidente."
      - "RecommendationApiTest usa un Pipeline falso para el entitlement; el lado Pipeline se prueba aparte."
      - "Ninguna prueba cubre una lectura VIEW de revisiones con revisiones existentes."
      - "El workflow pipesor-report.yml no tiene prueba automatizada; solo hay evidencia empírica de ejecuciones OE3 en dev."
