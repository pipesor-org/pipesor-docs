# Presentación de secuencias del flujo de fallo CI/CD y del inicio de sesión de Pipesor.
#
# Autorizado por el responsable el 27/11/2026 (decisión 1): «modelos de presentación nuevos con
# generador PlantUML, validador, pruebas; cada mensaje cita un rel_* existente o una evidencia
# repo@sha:archivo:línea, con estado; lo implementado no modelado aparece marcado como tal, sin
# añadirse a architecture.yml».
#
# Este modelo es de presentación. No crea, retira ni reinterpreta arquitectura, no cambia `status`
# ni `source` y no resuelve open_questions ni decisiones pendientes (PD); las divergencias se anotan.
# Un diagrama generado no acredita comportamiento en runtime: la evidencia es código o IaC en la
# revisión fijada en model/implementation_status.yml (`repositories`), no una ejecución observada.
#
# Convenciones:
# - participants[].element es un id de model/architecture.yml. Lo que no existe en el modelo
#   (navegador, workers internos) se declara `implementation_only: true` con `kind` y `evidence`;
#   `parent` opcional indica el elemento modelado que lo contiene.
# - Un mensaje cita `relationship` (rel_* existente) cuyos extremos coinciden con los elementos de
#   sus participantes; se acepta un componente frente a la relación de su contenedor o al revés.
#   Las respuestas (`reply`) pueden recorrer la relación en sentido inverso. Si el paso no está
#   modelado, lleva `implementation_only: true` y `reason`. Los pasos internos (`self`) son siempre
#   implementation_only.
# - `state` usa tools/generators/evidence.py STATUSES; `evidence` es repo:ruta:línea[-línea].
# - `section` separa etapas: en la vista completa es un divisor.
model_version: "1.0.0"
purpose: >-
  Diagramas de secuencia para la Memoria de Tesis y el Capstone (A4): la primera mitad del fallo
  CI/CD (captura hasta la entrega a Recommendation), el diagnóstico asistido, la revisión humana con
  el informe en GitHub Actions y el inicio de sesión con GitHub, contrastados con el código.
authorization:
  date: "2026-11-27"
  decision: 1
  approved_by: responsable del proyecto
architecture_source: model/architecture.yml
evidence_source: model/implementation_status.yml
audit_sources:
  - "Auditoría de solo lectura del 27/11/2026: seq-a1-captura, seq-a2-diagnostico y seq-b-login (fuera del repositorio)"

sequences:
  # ---------------------------------------------------------------------------------------------
  - id: seq_a1_capture
    title: "CI/CD failure capture: from the GitHub Actions webhook to the Recommendation receipt"
    purpose: >-
      Primera mitad del flujo de fallo: un run fallido de GitHub Actions llega por webhook firmado,
      se admite contra el ámbito de captura, queda en un recibo durable, se prepara con el token de
      instalación, se normaliza y protege, se congela en el outbox y se publica en Service Bus; las
      tres suscripciones lo consumen y Correlation entrega el contexto a Recommendation, que solo
      registra un recibo y un job de diagnóstico.
    participants:
      - {id: dash, name: "AIOps Web Dashboard", element: web_dashboard}
      - {id: gha, name: "GitHub Actions", element: github_actions}
      - {id: ing, name: "Ingestion", element: ingestion_normalization_service}
      - {id: pg, name: "PostgreSQL", element: postgresql_operational_store}
      - {id: sb, name: "Service Bus", element: azure_service_bus}
      - {id: pip, name: "Pipeline", element: pipeline_service}
      - {id: le, name: "Log/Event", element: log_event_service}
      - {id: nlp, name: "NLP", element: nlp_log_processor}
      - {id: cor, name: "Correlation", element: evidence_correlation_engine}
      - {id: rec, name: "Recommendation", element: recommendation_service}
    untested:
      - "Ningún salto entre servicios se prueba con el par real: todos usan stubs, fakes o HttpServer locales."
      - "Ninguna prueba usa un Service Bus real ni el emulador: filtros, deduplicación, maxDeliveryCount, DLQ y TTL solo se comprueban en el plan de Terraform."
      - "Las pruebas HTTP del webhook simulan CaptureHandler; ninguna recorre servlet → JdbcCaptureAuthority → ledger."
      - "La lectura de GitHub (token de instalación, run, jobs y logs) solo se prueba contra un HttpServer local, nunca contra GitHub."
      - "La comprobación de ámbito de máquina con JdbcCaptureAuthority, la que corre en runtime, no tiene prueba directa."
      - "No hay prueba extremo a extremo automatizada en los repositorios de servicio."
    steps:
      - section: "Precondition: Pipeline synchronises the capture scope"
      - message:
          from: pip
          to: ing
          style: sync
          text: "PUT /internal/v1/capture/workflow-scopes/{repo}/{workflow} (Pipeline.CaptureScope.Write)"
          relationship: rel_pipeline_ingestion_github_access
          state: implemented
          note: "Sent after each registration commit and by a 5-minute reconciliation."
          evidence:
            - pipeline:src/main/java/org/pipesor/pipeline/catalog/infrastructure/capture/HttpCaptureScopeSync.java:34
            - pipeline:src/main/java/org/pipesor/pipeline/catalog/infrastructure/capture/HttpCaptureScopeSync.java:87-93
            - pipeline:src/main/java/org/pipesor/pipeline/configuration/OperationsConfiguration.java:193
            - pipeline:src/main/java/org/pipesor/pipeline/configuration/CaptureScopeConfiguration.java:91
      - message:
          from: ing
          to: pg
          style: sync
          text: "Upsert capture_workflow_scopes; revision changes only with the state (replay_window 20 min)"
          relationship: rel_ingestion_postgresql_connector_metadata
          state: implemented
          idempotency: "Upsert by primary key; unchanged state keeps the revision"
          evidence:
            - ingestion:src/main/java/org/pipesor/ingestion/capture/interfaces/rest/CaptureScopeController.java:38-66
            - ingestion:src/main/java/org/pipesor/ingestion/capture/infrastructure/persistence/jdbc/JdbcCaptureAuthority.java:204-238
            - ingestion:src/main/resources/application.yml:112
      - message:
          from: ing
          to: pip
          style: reply
          text: "200 synced (404 repository not admitted, 409 pipeline of another owner)"
          relationship: rel_pipeline_ingestion_github_access
          state: implemented
          evidence:
            - ingestion:src/main/java/org/pipesor/ingestion/capture/interfaces/rest/CaptureScopeController.java:38-66

      - section: "Signed webhook and admission"
      - message:
          from: gha
          to: ing
          style: sync
          text: "POST /webhooks/v1/github/workflow-runs (workflow_run, X-Hub-Signature-256, X-GitHub-Delivery)"
          relationship: rel_github_actions_ingestion_event
          state: implemented
          note: "Off by default; IaC turns it on when a webhook secret version is set. Own security chain without platform token; 16 requests in flight and a 5 s budget."
          evidence:
            - ingestion:src/main/java/org/pipesor/ingestion/configuration/GitHubWebhookConfiguration.java:27-37
            - ingestion:src/main/java/org/pipesor/ingestion/capture/interfaces/webhook/GitHubWebhookServlet.java:35-89
            - ingestion:src/main/resources/application.yml:79
            - iac:modules/workloads/main.tf:110-114
      - message:
          from: ing
          to: ing
          style: self
          text: "Verify HMAC-SHA256 of the raw body in constant time, before parsing"
          implementation_only: true
          reason: "Paso interno de Ingestion; el modelo no detalla la verificación de la firma."
          state: implemented
          evidence:
            - ingestion:src/main/java/org/pipesor/ingestion/capture/interfaces/webhook/GitHubWorkflowWebhook.java:89-93
            - ingestion:src/main/java/org/pipesor/ingestion/capture/interfaces/webhook/GitHubWorkflowWebhook.java:102-114
      - fragment:
          kind: alt
          label: "rejected before admission"
          branches:
            - guard: "signature header missing, malformed or HMAC mismatch"
              steps:
                - message:
                    from: ing
                    to: gha
                    style: reply
                    text: "403, nothing stored (503 if the secret is unavailable)"
                    relationship: rel_github_actions_ingestion_event
                    state: implemented
                    evidence:
                      - ingestion:src/main/java/org/pipesor/ingestion/capture/interfaces/webhook/GitHubWebhookServlet.java:39-40
                      - ingestion:src/main/java/org/pipesor/ingestion/capture/interfaces/webhook/GitHubWebhookServlet.java:81
                      - ingestion:src/main/java/org/pipesor/ingestion/capture/interfaces/webhook/GitHubWorkflowWebhook.java:102-114
            - guard: "ping, another event or action other than completed"
              steps:
                - message:
                    from: ing
                    to: gha
                    style: reply
                    text: "204 without writing (conclusion is not filtered here)"
                    relationship: rel_github_actions_ingestion_event
                    state: implemented
                    evidence:
                      - ingestion:src/main/java/org/pipesor/ingestion/capture/interfaces/webhook/GitHubWorkflowWebhook.java:84-86
                      - ingestion:src/main/java/org/pipesor/ingestion/configuration/GitHubConfiguration.java:199
      - message:
          from: ing
          to: pg
          style: sync
          text: "Resolve ACTIVE capture_workflow_scopes, exact revision and non-revoked admission"
          relationship: rel_ingestion_postgresql_connector_metadata
          state: implemented
          evidence:
            - ingestion:src/main/java/org/pipesor/ingestion/capture/infrastructure/persistence/jdbc/JdbcCaptureAuthority.java:179-202
            - ingestion:src/main/java/org/pipesor/ingestion/capture/interfaces/webhook/GitHubWorkflowWebhook.java:60-78
            - ingestion:src/main/java/org/pipesor/ingestion/capture/application/commandhandlers/CaptureHandler.java:101-107
            - ingestion:src/main/java/org/pipesor/ingestion/capture/infrastructure/persistence/jdbc/JdbcCaptureAuthority.java:309-320
      - fragment:
          kind: opt
          label: "outside the capture scope"
          branches:
            - guard: "no ACTIVE scope (paused or not yet synchronised), revision changed or admission revoked"
              steps:
                - message:
                    from: ing
                    to: gha
                    style: reply
                    text: "403: capture discarded, no retry"
                    relationship: rel_github_actions_ingestion_event
                    state: implemented
                    note: "ADR-023 acknowledges the window before the first scope synchronisation."
                    evidence:
                      - ingestion:src/main/java/org/pipesor/ingestion/capture/interfaces/webhook/GitHubWorkflowWebhook.java:60-78
                      - ingestion:src/main/java/org/pipesor/ingestion/capture/interfaces/webhook/GitHubWebhookServlet.java:82
      - section: "Durable receipt and answer to GitHub"
      - message:
          from: ing
          to: pg
          style: sync
          text: "INSERT capture_receipts (ACCEPTED) and capture_delivery_aliases before answering"
          relationship: rel_ingestion_postgresql_connector_metadata
          state: implemented
          idempotency: "Key = SHA-256 of the signed body, ON CONFLICT DO NOTHING; one alias per X-GitHub-Delivery"
          evidence:
            - ingestion:src/main/java/org/pipesor/ingestion/capture/infrastructure/persistence/jpa/JpaCaptureLedger.java:87-116
            - ingestion:src/main/java/org/pipesor/ingestion/capture/interfaces/webhook/GitHubWorkflowWebhook.java:71
            - ingestion:src/main/resources/db/migration/V2__capture_publication_ledger.sql:158-162
      - fragment:
          kind: alt
          label: "answer to GitHub"
          branches:
            - guard: "new body, or same body under any delivery id"
              steps:
                - message:
                    from: ing
                    to: gha
                    style: reply
                    text: "204 No Content (a duplicate returns the same receipt)"
                    relationship: rel_github_actions_ingestion_event
                    state: implemented
                    note: "No code recovers missed deliveries; only the manual analysis remains."
                    evidence:
                      - ingestion:src/main/java/org/pipesor/ingestion/capture/infrastructure/persistence/jpa/JpaCaptureLedger.java:96
                      - ingestion:src/main/java/org/pipesor/ingestion/capture/infrastructure/persistence/jpa/JpaCaptureLedger.java:107-110
            - guard: "delivery id reused with another body, or same body for another run or attempt"
              steps:
                - message:
                    from: ing
                    to: gha
                    style: reply
                    text: "409 conflicting delivery identity"
                    relationship: rel_github_actions_ingestion_event
                    state: implemented
                    evidence:
                      - ingestion:src/main/java/org/pipesor/ingestion/capture/infrastructure/persistence/jpa/JpaCaptureLedger.java:102-113
            - guard: "commit later than the 5 s budget"
              steps:
                - message:
                    from: ing
                    to: gha
                    style: reply
                    text: "503 even though the receipt is committed"
                    relationship: rel_github_actions_ingestion_event
                    state: implemented
                    evidence:
                      - ingestion:src/main/java/org/pipesor/ingestion/capture/interfaces/webhook/GitHubWebhookServlet.java:60
      - section: "Manual alternative"
      - fragment:
          kind: opt
          label: "manual alternative"
          branches:
            - guard: "a GitHub administrator requests the analysis of a run attempt"
              steps:
                - message:
                    from: dash
                    to: ing
                    style: sync
                    text: "POST /api/v1/github/repositories/{r}/workflows/{w}/runs/{run}/attempts/{n}/analysis"
                    relationship: rel_dashboard_ingestion_github_connection
                    state: implemented
                    note: "Requires GitHub administration; reconciliation question 14 (OPERATE or administrator) is open."
                    evidence:
                      - frontend:src/entities/workflow-run/model/api.ts:77-83
                      - ingestion:src/main/java/org/pipesor/ingestion/github/interfaces/rest/AnalysisController.java:23
                      - ingestion:src/main/java/org/pipesor/ingestion/github/interfaces/rest/AnalysisController.java:32
                      - ingestion:src/main/java/org/pipesor/ingestion/capture/application/commandhandlers/GitHubAnalysisHandler.java:82-98
                - message:
                    from: ing
                    to: pg
                    style: sync
                    text: "Receipt with alias on-demand: and synthetic digest; joins the preparation below"
                    relationship: rel_ingestion_postgresql_connector_metadata
                    state: implemented
                    idempotency: "Re-analysing a published run reuses the observation and republishes nothing"
                    evidence:
                      - ingestion:src/main/java/org/pipesor/ingestion/capture/application/commandhandlers/RequestGitHubCapture.java:31-48
                      - ingestion:src/main/java/org/pipesor/ingestion/capture/infrastructure/persistence/jpa/JpaCaptureLedger.java:165-168

      - section: "Preparation worker (every 5 s): claim and GitHub read"
      - message:
          from: ing
          to: pg
          style: sync
          text: "Claim an ACCEPTED receipt (lease 2 min, fence); re-check its scope"
          relationship: rel_ingestion_postgresql_connector_metadata
          state: implemented
          idempotency: "Lease and fence; only phase ACCEPTED is claimable"
          evidence:
            - ingestion:src/main/java/org/pipesor/ingestion/capture/infrastructure/scheduling/PreparationRunner.java:43-51
            - ingestion:src/main/java/org/pipesor/ingestion/capture/application/commandhandlers/PreparationWorker.java:41-98
            - ingestion:src/main/java/org/pipesor/ingestion/capture/infrastructure/persistence/jpa/JpaCaptureLedger.java:118-130
            - ingestion:src/main/java/org/pipesor/ingestion/capture/application/commandhandlers/CaptureHandler.java:39-44
            - ingestion:src/main/resources/application.yml:131
      - message:
          from: ing
          to: gha
          style: sync
          text: "App JWT; GET installation; POST access_tokens (repository_ids=[repo], actions:read, metadata:read)"
          relationship: rel_ingestion_github_actions_read
          state: implemented
          evidence:
            - ingestion:src/main/java/org/pipesor/ingestion/capture/infrastructure/github/GitHubMachineTransport.java:67-77
      - message:
          from: ing
          to: gha
          style: sync
          text: "GET run attempt and jobs; logs ZIP only when the conclusion is failure or timed_out"
          relationship: rel_ingestion_github_actions_read
          state: partial
          note: "No artifact is downloaded, although the relationship reads 'logs, artifacts and metadata'."
          evidence:
            - ingestion:src/main/java/org/pipesor/ingestion/capture/infrastructure/github/GitHubMachineTransport.java:86-104
            - ingestion:src/main/java/org/pipesor/ingestion/capture/infrastructure/github/GitHubMachineTransport.java:124-132
      - section: "GitHub outcome, normalisation and frozen plan"
      - fragment:
          kind: alt
          label: "GitHub outcome"
          branches:
            - guard: "410 on the logs"
              steps:
                - message:
                    from: ing
                    to: pg
                    style: sync
                    text: "Receipt BLOCKED SOURCE_EXPIRED (terminal)"
                    relationship: rel_ingestion_postgresql_connector_metadata
                    state: implemented
                    evidence:
                      - ingestion:src/main/java/org/pipesor/ingestion/capture/infrastructure/github/GitHubMachineTransport.java:272
                      - ingestion:src/main/java/org/pipesor/ingestion/capture/application/commandhandlers/PrepareGitHubCapture.java:53-56
                      - ingestion:src/main/java/org/pipesor/ingestion/capture/application/commandhandlers/CaptureHandler.java:46-49
                      - ingestion:src/main/java/org/pipesor/ingestion/capture/infrastructure/persistence/jpa/JpaCaptureLedger.java:188-203
            - guard: "404, suspended installation, other account or repository"
              steps:
                - message:
                    from: ing
                    to: ing
                    style: self
                    text: "SCOPE_CHANGED is only counted; the receipt is not persisted as BLOCKED"
                    implementation_only: true
                    reason: "Rama interna del worker de preparación, no modelada."
                    state: divergent
                    note: "DD-021 asks to keep the block visible."
                    evidence:
                      - ingestion:src/main/java/org/pipesor/ingestion/capture/infrastructure/github/GitHubMachineTransport.java:270
                      - ingestion:src/main/java/org/pipesor/ingestion/capture/application/commandhandlers/PreparationWorker.java:78-94
            - guard: "403 or 429, SSO, 35 s budget, protection refused or invalid input"
              steps:
                - fragment:
                    kind: loop
                    label: "on every lease expiry, without Retry-After, backoff or maximum"
                    branches:
                      - guard: "GitHub unavailable or the input is refused"
                        steps:
                          - message:
                              from: ing
                              to: pg
                              style: sync
                              text: "Receipt stays ACCEPTED and is claimed again after the lease (~2 min)"
                              relationship: rel_ingestion_postgresql_connector_metadata
                              state: divergent
                              note: "capture_receipts has no attempt counter: a refused input loops indefinitely, against the visible block of DD-021."
                              evidence:
                                - ingestion:src/main/java/org/pipesor/ingestion/capture/infrastructure/github/GitHubMachineTransport.java:273
                                - ingestion:src/main/java/org/pipesor/ingestion/capture/application/commandhandlers/PreparationWorker.java:78-94
                                - ingestion:src/main/resources/db/migration/V2__capture_publication_ledger.sql:3-31
            - guard: "run read"
              steps:
                - message:
                    from: ing
                    to: ing
                    style: self
                    text: "Classify (first failed job and step, excerpt of 40 lines or fewer), normalise, protect (refuses PRIVATE KEY, 256 KiB maximum)"
                    implementation_only: true
                    reason: "Paso interno de Ingestion (capacidades de normalización y protección del elemento); el modelo no lo detalla."
                    state: partial
                    note: "service and environment of canonical_event_context are always null."
                    evidence:
                      - ingestion:src/main/java/org/pipesor/ingestion/capture/application/services/FailedRunEvidenceProfile.java:67-103
                      - ingestion:src/main/java/org/pipesor/ingestion/capture/application/services/FailedRunEvidenceProfile.java:100
                      - ingestion:src/main/java/org/pipesor/ingestion/normalization/application/commandhandlers/NormalizeObservationHandler.java:19-50
                      - ingestion:src/main/java/org/pipesor/ingestion/normalization/infrastructure/protection/BoundedEvidenceProtection.java:35-56
                      - ingestion:src/main/java/org/pipesor/ingestion/normalization/infrastructure/protection/BoundedEvidenceProtection.java:76
                      - ingestion:src/main/java/org/pipesor/ingestion/capture/application/commandhandlers/PrepareGitHubCapture.java:73-75
                - message:
                    from: ing
                    to: pg
                    style: sync
                    text: "Freeze the plan: capture_observations, publication_outputs PENDING (snapshot, plus evidence if failed), receipt PREPARED"
                    relationship: rel_ingestion_postgresql_connector_metadata
                    state: implemented
                    idempotency: "ON CONFLICT observation_key: an existing observation is reused and no new outputs are created"
                    evidence:
                      - ingestion:src/main/java/org/pipesor/ingestion/capture/infrastructure/persistence/jpa/JpaCaptureLedger.java:132-176
                      - ingestion:src/main/java/org/pipesor/ingestion/capture/domain/services/ObservationFingerprint.java:18-43
                      - ingestion:src/main/resources/db/migration/V2__capture_publication_ledger.sql:189-240

      - section: "Publication outbox (every 5 s)"
      - message:
          from: ing
          to: pg
          style: sync
          text: "Claim a PENDING output, snapshot first (SKIP LOCKED, lease 30 s)"
          relationship: rel_ingestion_postgresql_connector_metadata
          state: implemented
          evidence:
            - ingestion:src/main/java/org/pipesor/ingestion/capture/infrastructure/scheduling/PublicationRunner.java:27
            - ingestion:src/main/java/org/pipesor/ingestion/capture/application/commandhandlers/PublicationWorker.java:52
            - ingestion:src/main/java/org/pipesor/ingestion/capture/infrastructure/persistence/jpa/JpaCaptureLedger.java:204-229
            - ingestion:src/main/resources/application.yml:138
      - message:
          from: ing
          to: sb
          style: async
          text: "Topic workflow-evidence: execution.snapshot v1, then protected_workflow_evidence 2.2 (MessageId = output id)"
          relationship: rel_ingestion_service_bus
          state: implemented
          idempotency: "Frozen bytes and stable MessageId; broker duplicate detection for 10 min"
          note: "No ordering guarantee: supportOrdering is false and there are no sessions."
          evidence:
            - ingestion:src/main/java/org/pipesor/ingestion/capture/application/commandhandlers/CaptureHandler.java:57-84
            - ingestion:src/main/java/org/pipesor/ingestion/capture/infrastructure/messaging/AzureServiceBusPublisher.java:21-30
            - ingestion:src/main/java/org/pipesor/ingestion/normalization/interfaces/messaging/transform/NormalizedMessagesTransformer.java:20-40
            - iac:modules/service-bus/main.tf:22-47
      - fragment:
          kind: alt
          label: "publication result"
          branches:
            - guard: "send failed after the two SDK retries"
              steps:
                - fragment:
                    kind: loop
                    label: "every 30 s, no maximum and no producer DLQ"
                    branches:
                      - guard: "until the broker accepts the message"
                        steps:
                          - message:
                              from: ing
                              to: pg
                              style: sync
                              text: "Output back to PENDING, next_attempt_at +30 s"
                              relationship: rel_ingestion_postgresql_connector_metadata
                              state: implemented
                              evidence:
                                - ingestion:src/main/java/org/pipesor/ingestion/configuration/MessagingConfiguration.java:23-32
                                - ingestion:src/main/java/org/pipesor/ingestion/capture/application/commandhandlers/CaptureHandler.java:77-90
                                - ingestion:src/main/java/org/pipesor/ingestion/capture/infrastructure/persistence/jpa/JpaCaptureLedger.java:256-266
                                - ingestion:src/main/resources/application.yml:139
            - guard: "scope lost between claim and send"
              steps:
                - message:
                    from: ing
                    to: pg
                    style: sync
                    text: "Output BLOCKED"
                    relationship: rel_ingestion_postgresql_connector_metadata
                    state: implemented
                    evidence:
                      - ingestion:src/main/java/org/pipesor/ingestion/capture/application/commandhandlers/CaptureHandler.java:69-76
                      - ingestion:src/main/java/org/pipesor/ingestion/capture/infrastructure/persistence/jpa/JpaCaptureLedger.java:267-276
            - guard: "sent"
              steps:
                - message:
                    from: ing
                    to: pg
                    style: sync
                    text: "Output CONFIRMED; receipt PUBLISHED once every output is confirmed"
                    relationship: rel_ingestion_postgresql_connector_metadata
                    state: implemented
                    note: "purgeConfirmedPayloads exists but no process calls it."
                    evidence:
                      - ingestion:src/main/java/org/pipesor/ingestion/capture/infrastructure/persistence/jpa/JpaCaptureLedger.java:230-249
                      - ingestion:src/main/java/org/pipesor/ingestion/capture/infrastructure/persistence/jpa/JpaCaptureLedger.java:277-296

      - section: "Fan-out to the three subscriptions"
      - fragment:
          kind: par
          label: "one message, three subscriptions"
          branches:
            - guard: "subscription pipeline (filter execution.snapshot)"
              steps:
                - message:
                    from: sb
                    to: pip
                    style: async
                    text: "execution.snapshot (peek-lock, 10 deliveries, lock renewed up to 5 min)"
                    relationship: rel_service_bus_pipeline_service
                    state: implemented
                    evidence:
                      - pipeline:src/main/java/org/pipesor/pipeline/configuration/ServiceBusConfiguration.java:33-53
                      - pipeline:src/main/java/org/pipesor/pipeline/execution/interfaces/messaging/ServiceBusSnapshotConsumer.java:33-67
                      - iac:modules/service-bus/main.tf:52-61
                      - iac:environments/dev/terraform.tfvars.example:17-26
            - guard: "subscription log-event (filter protected_workflow_evidence)"
              steps:
                - message:
                    from: sb
                    to: le
                    style: async
                    text: "protected_workflow_evidence 2.2 (peek-lock, 10 deliveries)"
                    relationship: rel_service_bus_log_event_service
                    state: implemented
                    evidence:
