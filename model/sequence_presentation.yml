                      - ingestion:src/main/java/org/pipesor/ingestion/shared/interfaces/rest/ApiExceptionHandler.java:66
      - section: "Redirect to GitHub"
      - fragment:
          kind: opt
          label: "first call only"
          branches:
            - guard: "client_id not cached (IaC does not set it)"
              steps:
                - message:
                    from: ing
