      a la admisión.
    source:
    - 'pipesor-recommendation-service@3d53d26: V3__identify_admitted_diagnoses.sql'
    - DD-027
  - name: context_id
    type: uuid
    pk: false
    nullable: false
    unique: false
    er_visible: true
    assumption: null
    description_es: Contexto correlacionado recibido; copia de output.contextId. Referencia lógica dentro
      del schema, sin FK, como en la migración.
    logical_ref: diagnosis.correlated_context_receipts.context_id
    source:
    - 'pipesor-recommendation-service@3d53d26: V6__index_diagnosis_context_and_execution.sql'
    - DD-027
  - name: execution_id
    type: uuid
    pk: false
    nullable: false
    unique: false
    er_visible: true
    assumption: null
    description_es: Ejecución diagnosticada; copia de output.executionId. Referencia lógica cross-schema.
    logical_ref: ops.pipeline_executions.id
    source:
    - 'pipesor-recommendation-service@3d53d26: V6__index_diagnosis_context_and_execution.sql'
    - DD-027
  traceability_required: true
  retention_policy: RET-001
  unique_constraints:
  - columns:
    - incident_id
    - version
    name: diagnoses_incident_id_version_uq
  checks:
  - name: diagnoses_check_1
    expression: version > 0
  - name: diagnoses_check_2
    expression: status <> 'DIAGNOSIS_READY' OR (probable_cause IS NOT NULL AND btrim(probable_cause) <>
      '' AND diagnosis_ready_at IS NOT NULL)
  - name: diagnoses_admission_fingerprint_check
    expression: admission_fingerprint IS NULL OR admission_fingerprint ~ '^[0-9a-f]{64}$'
  - name: diagnoses_context_matches_output_ck
    expression: context_id = (output->>'contextId')::uuid
  - name: diagnoses_execution_matches_output_ck
    expression: execution_id = (output->>'executionId')::uuid
  partial_unique_constraints:
  - name: diagnoses_admitted_context_uq
    columns:
    - context_id
    where: admission_fingerprint IS NOT NULL
  domain_constraints:
  - append_only
