      evidencia y fuentes por ID). DD-027 registra su divergencia con las columnas de DD-003/DD-004/DD-007/DD-010.
    source:
    - 'pipesor-recommendation-service@3d53d26: V2__persist_diagnostic_reviews.sql'
    - DD-027
