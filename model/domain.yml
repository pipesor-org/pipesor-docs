- id: execution_event_receipts
  table: execution_event_receipts
  schema: ops
  owner_container: pipeline_service
  description_es: Recibo técnico durable de cada evento execution.snapshot consumido; identidad, digests
    y disposición para deduplicar y ordenar entregas, sin payload ni logs.
  scope_basis: approved_domain
  status: inferred
  source:
  - architecture.yml#pipeline_service
  - architecture.yml#rel_service_bus_pipeline_service
  - 'pipesor-pipeline-service@dcaa002: docs/architecture.md#contrato-de-evento-normalizado-v1-aprobado-en-sesion,
    V5__create_execution_event_receipts.sql'
  - DD-026
  attributes:
  - name: event_id
    type: uuid
    pk: true
    nullable: false
    unique: false
    er_visible: true
    assumption: null
    description_es: Identidad del evento entregado (eventId); asignada por el productor, no por Pipeline.
  - name: execution_id
    type: uuid
    pk: false
    nullable: false
    unique: false
    er_visible: true
    assumption: null
    description_es: Ejecución descrita por el evento; sin FK porque un evento pausado puede preceder
      a la fila de la ejecución.
    logical_ref: ops.pipeline_executions.id
  - name: message_digest
    type: text
    pk: false
    nullable: false
    unique: false
    er_visible: false
    assumption: null
    description_es: SHA-256 hexadecimal del mensaje canónico; detecta reutilización conflictiva del
      eventId.
  - name: content_digest
    type: text
    pk: false
    nullable: false
    unique: false
    er_visible: false
    assumption: null
    description_es: SHA-256 hexadecimal del contenido canónico del snapshot; distingue snapshots idénticos
      de conflictivos.
  - name: source_updated_at
    type: timestamptz
    pk: false
    nullable: false
    unique: false
    er_visible: false
    assumption: null
    description_es: Instante upstream del snapshot truncado a microsegundos; ordena versiones de la
      fuente.
  - name: source_submicro_nanos
    type: integer
    pk: false
    nullable: false
    unique: false
    er_visible: false
    assumption: null
    description_es: Nanosegundos restantes (0..999) para reconstruir el instante exacto de la fuente.
  - name: disposition
    type: text
    pk: false
    nullable: false
    unique: false
    er_visible: true
    assumption: null
    description_es: 'Resultado registrado: APPLIED, DUPLICATE, IGNORED_STALE o IGNORED_PAUSED.'
  - name: correlation_id
    type: text
    pk: false
    nullable: false
    unique: false
    er_visible: true
    assumption: null
    description_es: Identificador de correlación del evento; no contiene información sensible.
  - name: created_at
    type: timestamptz
    pk: false
    nullable: false
    unique: false
    er_visible: false
    assumption: A-002
    description_es: Instante de persistencia del recibo; sin política de purga.
  traceability_required: true
  retention_policy: null
  checks:
  - name: execution_event_receipts_message_digest_check
    expression: message_digest ~ '^[0-9a-f]{64}$'
  - name: execution_event_receipts_content_digest_check
    expression: content_digest ~ '^[0-9a-f]{64}$'
