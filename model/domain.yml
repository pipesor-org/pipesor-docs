  from: evidence.correlation_groups.incident_id
  to: ops.incidents.id
  kind: logical_ref
  cardinality: many_to_one
  source:
  - DD-023
- id: correlation_receipts_evidence_id
  from: evidence.correlation_receipts.evidence_id
  to: evidence.evidence_items.id
  kind: logical_ref
  cardinality: many_to_one
