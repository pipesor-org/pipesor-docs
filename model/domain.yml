    description_es: created at
  unique_constraints:
  - name: capture_observations_key_uq
    columns:
    - capture_domain
    - source
    - observation_key
  - name: capture_observations_membership_uq
    columns:
    - capture_domain
    - source
    - id
  checks:
  - name: capture_observations_capture_domain_ck
    expression: btrim(capture_domain) <> ''
  - name: capture_observations_source_ck
    expression: btrim(source) <> ''
  - name: capture_observations_observation_key_ck
    expression: observation_key ~ '^[0-9a-f]{64}$'
  - name: capture_observations_protected_content_digest_ck
    expression: btrim(protected_content_digest) <> ''
  - name: capture_observations_protected_content_digest_format_ck
    expression: protected_content_digest ~ '^[0-9a-f]{64}$'
  - name: capture_observations_repository_id_ck
    expression: btrim(repository_id) <> ''
  - name: capture_observations_repository_id_format_ck
    expression: repository_id ~ '^[1-9][0-9]*$'
  - name: capture_observations_workflow_id_ck
    expression: btrim(workflow_id) <> ''
  - name: capture_observations_workflow_id_format_ck
    expression: workflow_id ~ '^[1-9][0-9]*$'
  - name: capture_observations_run_id_ck
    expression: btrim(run_id) <> ''
  - name: capture_observations_run_id_format_ck
    expression: run_id ~ '^[1-9][0-9]*$'
  - name: capture_observations_attempt_ck
    expression: run_attempt > 0
  - name: capture_observations_normalizer_version_ck
    expression: btrim(normalizer_version) <> ''
  - name: capture_observations_protection_policy_version_ck
    expression: btrim(protection_policy_version) <> ''
  - name: capture_observations_correlation_id_ck
    expression: btrim(correlation_id) <> ''
  - name: capture_observations_plan_ck
    expression: required_output_count IN (1,2)
  - name: capture_observations_observed_at_submicro_ck
    expression: observed_at_submicro BETWEEN 0 AND 999
  - name: capture_observations_source_updated_at_submicro_ck
    expression: source_updated_at_submicro BETWEEN 0 AND 999
  foreign_keys:
  - name: capture_observations_origin_fk
    columns:
    - capture_domain
    - source
    - origin_receipt_id
    references:
      table: ingestion.capture_receipts
      columns:
      - capture_domain
      - source
      - id
    deferrable: true
    initially_deferred: true
  partial_unique_constraints: []
  domain_constraints:
  - capture_lifecycle
  traceability_required: false
  retention_policy: null
- id: publication_outputs
  table: publication_outputs
  schema: ingestion
  owner_container: ingestion_normalization_service
  description_es: 'Captura/publicación durable de Ingestion: publication_outputs'
  scope_basis: approved_domain
  status: confirmed
  source:
  - DD-021
  - 'capture-publication-draft-0.1 — adopción local 2026-11-08: Vamos a por ello'
  attributes:
  - name: id
    type: uuid
    pk: true
    nullable: false
    unique: false
    er_visible: true
    assumption: null
    description_es: id
  - name: observation_id
    type: uuid
    pk: false
    nullable: false
    unique: false
    er_visible: true
    assumption: null
    description_es: observation id
  - name: event_type
    type: text
    pk: false
    nullable: false
    unique: false
    er_visible: false
    assumption: null
    description_es: event type
  - name: schema_major
    type: integer
    pk: false
    nullable: false
    unique: false
    er_visible: false
    assumption: null
    description_es: schema major
  - name: fragment_locator
    type: text
    pk: false
    nullable: true
    unique: false
    er_visible: false
    assumption: null
    description_es: fragment locator
  - name: payload
    type: bytea
    pk: false
    nullable: true
    unique: false
    er_visible: false
    assumption: null
    description_es: payload
  - name: payload_digest
    type: text
    pk: false
    nullable: false
    unique: false
    er_visible: false
    assumption: null
    description_es: payload digest
  - name: phase
    type: text
    pk: false
    nullable: false
    unique: false
    er_visible: false
    assumption: null
    description_es: phase
  - name: revision
    type: bigint
    pk: false
    nullable: false
    unique: false
    er_visible: false
    assumption: null
    description_es: revision
  - name: claim_fence
    type: bigint
    pk: false
    nullable: false
    unique: false
    er_visible: false
    assumption: null
    description_es: claim fence
  - name: attempt_count
    type: bigint
    pk: false
    nullable: false
    unique: false
    er_visible: false
    assumption: null
    description_es: attempt count
  - name: claim_owner
    type: uuid
    pk: false
    nullable: true
    unique: false
    er_visible: false
    assumption: null
    description_es: claim owner
  - name: lease_until
    type: timestamptz
    pk: false
    nullable: true
    unique: false
    er_visible: false
    assumption: null
    description_es: lease until
  - name: next_attempt_at
    type: timestamptz
    pk: false
    nullable: true
    unique: false
    er_visible: false
    assumption: null
    description_es: next attempt at
  - name: last_attempt_at
    type: timestamptz
    pk: false
    nullable: true
    unique: false
    er_visible: false
    assumption: null
    description_es: last attempt at
  - name: confirmed_at
    type: timestamptz
    pk: false
    nullable: true
    unique: false
    er_visible: false
    assumption: null
    description_es: confirmed at
  - name: payload_removed_at
    type: timestamptz
    pk: false
    nullable: true
    unique: false
    er_visible: false
    assumption: null
    description_es: payload removed at
  - name: payload_recover_until
    type: timestamptz
    pk: false
    nullable: true
    unique: false
    er_visible: false
    assumption: null
    description_es: payload recover until
  - name: blocked_reason
    type: text
    pk: false
    nullable: true
    unique: false
    er_visible: false
    assumption: null
    description_es: blocked reason
  - name: created_at
    type: timestamptz
    pk: false
    nullable: false
    unique: false
    er_visible: false
    assumption: null
    description_es: created at
  - name: updated_at
    type: timestamptz
    pk: false
    nullable: false
    unique: false
    er_visible: false
    assumption: null
    description_es: updated at
  unique_constraints: []
  checks:
  - name: publication_outputs_event_type_ck
    expression: btrim(event_type) <> ''
  - name: publication_outputs_payload_digest_ck
    expression: btrim(payload_digest) <> ''
  - name: publication_outputs_payload_digest_format_ck
    expression: payload_digest ~ '^[0-9a-f]{64}$'
  - name: publication_outputs_phase_nonempty_ck
    expression: btrim(phase) <> ''
  - name: publication_outputs_revision_ck
    expression: revision >= 0
  - name: publication_outputs_claim_fence_ck
    expression: claim_fence >= 0
  - name: publication_outputs_attempt_count_ck
    expression: attempt_count >= 0
  - name: publication_outputs_timestamps_ck
    expression: updated_at >= created_at
  - name: publication_outputs_claim_ck
    expression: (claim_owner IS NULL) = (lease_until IS NULL)
  - name: publication_outputs_blocked_ck
    expression: (phase = 'BLOCKED') = (blocked_reason IS NOT NULL) AND (blocked_reason IS NULL OR btrim(blocked_reason) <>
      '')
  - name: publication_outputs_contract_ck
    expression: (event_type = 'execution.snapshot' AND schema_major = 1 AND fragment_locator IS NULL) OR (event_type = 'protected_workflow_evidence'
      AND schema_major = 2 AND fragment_locator IS NOT NULL AND btrim(fragment_locator) <> '')
  - name: publication_outputs_phase_ck
    expression: phase IN ('PENDING','CLAIMED','CONFIRMED','BLOCKED')
  - name: publication_outputs_claim_phase_ck
    expression: (phase = 'CLAIMED') = (claim_owner IS NOT NULL)
  - name: publication_outputs_confirmed_ck
    expression: (phase = 'CONFIRMED') = (confirmed_at IS NOT NULL)
  - name: publication_outputs_payload_ck
    expression: (payload IS NOT NULL AND payload_removed_at IS NULL) OR (payload IS NULL AND phase = 'CONFIRMED' AND payload_removed_at
      IS NOT NULL AND payload_recover_until IS NOT NULL AND payload_removed_at >= payload_recover_until)
  - name: publication_outputs_lifecycle_times_ck
    expression: (confirmed_at IS NULL OR confirmed_at >= created_at) AND (payload_removed_at IS NULL OR payload_removed_at >= confirmed_at) AND (payload_recover_until IS NULL OR payload_recover_until > created_at)
  - name: publication_outputs_claim_time_ck
    expression: phase <> 'CLAIMED' OR (last_attempt_at IS NOT NULL AND lease_until > last_attempt_at AND attempt_count > 0)
  foreign_keys:
  - name: publication_outputs_observation_fk
    columns:
    - observation_id
    references:
      table: ingestion.capture_observations
      columns:
      - id
    deferrable: true
    initially_deferred: true
  partial_unique_constraints:
  - name: publication_outputs_snapshot_uq
    columns:
    - observation_id
    where: event_type = 'execution.snapshot'
  - name: publication_outputs_fragment_uq
    columns:
    - observation_id
    - fragment_locator
    where: event_type = 'protected_workflow_evidence'
  domain_constraints:
  - capture_lifecycle
  traceability_required: false
  retention_policy: null
- id: github_login_attempts
  table: github_login_attempts
  schema: ingestion
  owner_container: ingestion_normalization_service
  description_es: Intento de inicio de sesión GitHub de un solo uso y su handoff al dashboard; solo
    digests y referencias de custodia, nunca state, verifier, código, handoff ni tokens.
  scope_basis: approved_domain
  status: confirmed
  source:
  - docs/architecture/decisions/ADR-022-platform-identity-without-entra-app-registrations.md
  - docs/architecture/contracts/platform-identity-v1.md#5-login-flow-ingestion
  - docs/architecture/decisions/ADR-025-open-sign-in.md
  - DD-026
  attributes:
  - name: id
    type: uuid
    pk: true
    nullable: false
    unique: false
    er_visible: true
    assumption: null
    description_es: Identificador del intento asignado por Ingestion.
  - name: state_digest
    type: bytea
    pk: false
    nullable: false
    unique: false
    er_visible: false
    assumption: null
    description_es: SHA-256 del state OAuth de un solo uso; nunca el valor crudo.
  - name: pkce_secret_object_ref
    type: text
    pk: false
    nullable: false
    unique: false
    er_visible: false
    assumption: null
    description_es: Referencia lógica pkce:<id> al objeto de custodia del verifier; no contiene el secreto.
  - name: pkce_secret_version_ref
    type: text
    pk: false
    nullable: false
    unique: false
    er_visible: false
    assumption: null
    description_es: Versión exacta custodiada del verifier; nunca el alias latest.
  - name: return_path
    type: text
    pk: false
    nullable: false
    unique: false
    er_visible: false
    assumption: null
    description_es: Ruta relativa del dashboard a la que se vuelve tras el inicio de sesión.
  - name: phase
    type: text
    pk: false
    nullable: false
    unique: false
    er_visible: true
    assumption: null
    description_es: 'Fase del intento: READY, CLAIMED, HANDOFF_READY, COMPLETED o FAILED.'
  - name: expires_at
    type: timestamptz
    pk: false
    nullable: false
    unique: false
    er_visible: false
    assumption: null
    description_es: Expiración del intento; posterior a created_at.
  - name: correlation_id
    type: text
    pk: false
    nullable: false
    unique: false
    er_visible: false
    assumption: null
    description_es: Identificador de correlación no vacío; no contiene información sensible.
  - name: connection_id
    type: uuid
    pk: false
    nullable: true
    unique: false
    er_visible: true
    assumption: null
    description_es: Conexión DD-020 resultante del inicio de sesión; presente con el handoff, sin FK
      física.
    logical_ref: ingestion.github_connections.id
  - name: generation_id
    type: uuid
    pk: false
    nullable: true
    unique: false
    er_visible: true
    assumption: null
    description_es: Generación DD-020 resultante del inicio de sesión; presente con el handoff, sin FK
      física.
    logical_ref: ingestion.github_connection_generations.id
  - name: github_user_id
    type: text
    pk: false
    nullable: true
    unique: false
    er_visible: false
    assumption: null
    description_es: ID numérico del usuario GitHub verificado; presente con el handoff.
  - name: github_login
    type: text
    pk: false
    nullable: true
    unique: false
    er_visible: false
    assumption: null
    description_es: Login GitHub verificado para presentación; presente con el handoff.
  - name: handoff_digest
    type: bytea
    pk: false
    nullable: true
    unique: false
    er_visible: false
    assumption: null
    description_es: SHA-256 del handoff de un solo uso; único cuando existe y nunca el valor crudo.
  - name: handoff_expires_at
    type: timestamptz
    pk: false
    nullable: true
    unique: false
    er_visible: false
    assumption: null
    description_es: Expiración del handoff.
  - name: created_at
    type: timestamptz
    pk: false
    nullable: false
    unique: false
    er_visible: false
    assumption: null
    description_es: Instante de creación del intento.
  - name: updated_at
    type: timestamptz
    pk: false
    nullable: false
    unique: false
    er_visible: false
    assumption: null
    description_es: Instante del último cambio de fase.
  unique_constraints:
  - name: github_login_attempts_state_uq
    columns:
    - state_digest
  partial_unique_constraints:
  - name: github_login_attempts_handoff_uq
    columns:
    - handoff_digest
    where: handoff_digest IS NOT NULL
  checks:
  - name: github_login_attempts_phase_ck
    expression: phase IN ('READY','CLAIMED','HANDOFF_READY','COMPLETED','FAILED')
  - name: github_login_attempts_pkce_owner_ck
    expression: pkce_secret_object_ref = 'pkce:' || id::text
  - name: github_login_attempts_version_ck
    expression: btrim(pkce_secret_version_ref) <> '' AND lower(btrim(pkce_secret_version_ref)) <> 'latest'
  - name: github_login_attempts_return_ck
    expression: return_path ~ '^/'
  - name: github_login_attempts_correlation_ck
    expression: btrim(correlation_id) <> ''
  - name: github_login_attempts_expiry_ck
    expression: expires_at > created_at
  - name: github_login_attempts_timestamps_ck
    expression: updated_at >= created_at
  - name: github_login_attempts_handoff_ck
    expression: (phase IN ('HANDOFF_READY','COMPLETED')) = (handoff_digest IS NOT NULL) AND (handoff_digest
      IS NULL OR (handoff_expires_at IS NOT NULL AND connection_id IS NOT NULL AND generation_id IS NOT
      NULL AND github_user_id ~ '^[1-9][0-9]*$' AND btrim(github_login) <> ''))
  traceability_required: false
  retention_policy: null
- id: repository_admissions
  table: repository_admissions
  schema: ingestion
  owner_container: ingestion_normalization_service
  description_es: Admisión de un repositorio GitHub por tenant, importada por el operador o reconciliada
    desde su administrador; las revocadas se conservan.
  scope_basis: approved_domain
  status: confirmed
  source:
  - docs/architecture/decisions/ADR-023-capture-scope-from-registrations.md
  - docs/architecture/decisions/ADR-024-repository-administrator-admission.md
  - SRC_ADR_020
  - DD-026
  attributes:
  - name: tenant_id
    type: uuid
    pk: true
    nullable: false
    unique: false
    er_visible: true
    assumption: null
    description_es: Tenant de plataforma de la admisión.
  - name: app_id
    type: text
    pk: false
    nullable: false
    unique: false
    er_visible: false
    assumption: null
    description_es: ID numérico de la GitHub App pipesor.
  - name: account_id
    type: text
    pk: false
    nullable: false
    unique: false
    er_visible: false
    assumption: null
    description_es: ID numérico de la cuenta propietaria de la instalación.
  - name: installation_id
    type: text
    pk: false
    nullable: false
    unique: false
    er_visible: true
    assumption: null
    description_es: ID numérico de la instalación de la App.
  - name: repository_id
    type: text
    pk: true
    nullable: false
    unique: false
    er_visible: true
    assumption: null
    description_es: ID numérico del repositorio GitHub admitido.
  - name: admitted_at
    type: timestamptz
    pk: false
    nullable: false
    unique: false
    er_visible: false
    assumption: null
    description_es: Instante de la admisión o de su reactivación.
  - name: admitted_by
    type: text
    pk: false
    nullable: false
    unique: false
    er_visible: false
    assumption: null
    description_es: Referencia no vacía del sujeto que admitió (operador o administrador del repositorio).
  - name: source
    type: text
    pk: false
    nullable: false
    unique: false
    er_visible: true
    assumption: null
    description_es: 'Origen de la admisión: operator o repository_administrator.'
  - name: revoked_at
    type: timestamptz
    pk: false
    nullable: true
    unique: false
    er_visible: false
    assumption: null
    description_es: Instante de revocación cuando GitHub deja de listar el repositorio en la instalación.
  - name: revoked_by
    type: text
    pk: false
    nullable: true
    unique: false
    er_visible: false
    assumption: null
    description_es: Referencia del sujeto cuya reconciliación revocó; presente junto con revoked_at.
  checks:
  - name: repository_admissions_ids_ck
    expression: app_id ~ '^[1-9][0-9]*$' AND account_id ~ '^[1-9][0-9]*$' AND installation_id ~ '^[1-9][0-9]*$'
      AND repository_id ~ '^[1-9][0-9]*$'
  - name: repository_admissions_by_ck
    expression: btrim(admitted_by) <> ''
  - name: repository_admissions_source_ck
    expression: source IN ('operator','repository_administrator')
  - name: repository_admissions_revoked_ck
    expression: (revoked_at IS NULL) = (revoked_by IS NULL) AND (revoked_by IS NULL OR btrim(revoked_by)
      <> '')
  traceability_required: false
  retention_policy: null
- id: capture_workflow_scopes
  table: capture_workflow_scopes
  schema: ingestion
  owner_container: ingestion_normalization_service
  description_es: Alcance de captura máquina por workflow, sincronizado por Pipeline desde sus registros;
    cada cambio de estado incrementa la revisión y revoca la autoridad anterior.
  scope_basis: approved_domain
  status: confirmed
  source:
  - docs/architecture/decisions/ADR-023-capture-scope-from-registrations.md
  - docs/architecture/contracts/mvp-http-api-v1.md#internal-capture-workflow-scopes-adr-023
  - docs/architecture/decisions/ADR-024-repository-administrator-admission.md
  - DD-026
  attributes:
  - name: capture_domain
    type: text
    pk: true
    nullable: false
    unique: false
    er_visible: true
    assumption: null
    description_es: Partición confiable de autorización máquina (DD-021).
  - name: tenant_id
    type: uuid
    pk: true
    nullable: false
    unique: false
    er_visible: true
    assumption: null
    description_es: Tenant de plataforma del alcance.
  - name: app_id
    type: text
    pk: true
    nullable: false
    unique: false
    er_visible: true
    assumption: null
    description_es: ID numérico de la GitHub App pipesor.
  - name: account_id
    type: text
    pk: false
    nullable: false
    unique: false
    er_visible: false
    assumption: null
    description_es: ID numérico de la cuenta propietaria de la instalación.
  - name: installation_id
    type: text
    pk: false
    nullable: false
    unique: false
    er_visible: false
    assumption: null
    description_es: ID numérico de la instalación de la App.
  - name: repository_id
    type: text
    pk: true
    nullable: false
    unique: false
    er_visible: true
    assumption: null
    description_es: ID numérico del repositorio GitHub; debe estar admitido.
  - name: workflow_id
    type: text
    pk: true
    nullable: false
    unique: false
    er_visible: true
    assumption: null
    description_es: ID numérico del workflow GitHub.
  - name: pipeline_id
    type: uuid
    pk: false
    nullable: true
    unique: false
    er_visible: true
    assumption: null
    description_es: Pipeline registrado por referencia lógica; nulo en alcances importados sin registro.
    logical_ref: ops.pipelines.id
  - name: status
    type: text
    pk: false
    nullable: false
    unique: false
    er_visible: true
    assumption: null
    description_es: 'Estado de monitorización sincronizado desde Pipeline: ACTIVE o PAUSED.'
  - name: allowed_actions
    type: text[]
    pk: false
    nullable: false
    unique: false
    er_visible: false
    assumption: null
    description_es: Acciones workflow_run admitidas; subconjunto no vacío de requested, in_progress y
      completed.
  - name: replay_window
    type: interval
    pk: false
    nullable: false
    unique: false
    er_visible: false
    assumption: null
    description_es: Ventana de replay positiva.
  - name: revision
    type: bigint
    pk: false
    nullable: false
    unique: false
    er_visible: false
    assumption: null
    description_es: Revisión numérica positiva; aumenta con cada cambio de estado.
  - name: scope_revision
    type: text
    pk: false
    nullable: false
    unique: false
    er_visible: false
    assumption: null
    description_es: Revisión opaca derivada que comparan capturas, replays y comprobaciones de Pipeline.
  - name: updated_at
    type: timestamptz
    pk: false
    nullable: false
    unique: false
    er_visible: false
    assumption: null
    description_es: Instante de la última sincronización.
  checks:
  - name: capture_workflow_scopes_status_ck
    expression: status IN ('ACTIVE','PAUSED')
  - name: capture_workflow_scopes_ids_ck
    expression: app_id ~ '^[1-9][0-9]*$' AND account_id ~ '^[1-9][0-9]*$' AND installation_id ~ '^[1-9][0-9]*$'
      AND repository_id ~ '^[1-9][0-9]*$' AND workflow_id ~ '^[1-9][0-9]*$'
  - name: capture_workflow_scopes_actions_ck
    expression: cardinality(allowed_actions) > 0 AND allowed_actions <@ ARRAY['requested','in_progress','completed']::text[]
  - name: capture_workflow_scopes_replay_ck
    expression: replay_window > interval '0'
  - name: capture_workflow_scopes_revision_ck
    expression: revision > 0 AND scope_revision ~ '^[A-Za-z0-9._:-]{1,128}$'
  foreign_keys:
  - name: capture_workflow_scopes_admitted_fk
    columns:
    - tenant_id
    - repository_id
    references:
      table: ingestion.repository_admissions
      columns:
      - tenant_id
      - repository_id
  traceability_required: false
  retention_policy: null
relationships:
