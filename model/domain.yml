    expression: phase IN ('PREPARING','READY','CLAIMED','COMPLETED','FAILED','EXPIRED')
  - name: github_authorization_attempts_cleanup_state_ck
    expression: pkce_cleanup_state IN ('HELD','PENDING','COMPLETED','BLOCKED')
  - name: github_authorization_attempts_cleanup_result_ck
    expression: pkce_cleanup_result IS NULL OR pkce_cleanup_result IN ('CONFIRMED','UNAVAILABLE','SCOPE_UNAPPROVED','NOT_APPLICABLE')
  - name: github_authorization_attempts_revision_ck
