    expression: phase NOT IN ('CLAIMED','COMPLETED') OR consumed_at IS NOT NULL
  - name: github_authorization_attempts_unconsumed_ck
    expression: phase NOT IN ('PREPARING','READY') OR consumed_at IS NULL
  - name: github_authorization_attempts_cleanup_intent_ck
    expression: phase NOT IN ('COMPLETED','FAILED','EXPIRED') OR pkce_cleanup_state <> 'HELD'
  - name: github_authorization_attempts_cleanup_complete_ck
    expression: pkce_cleanup_state <> 'COMPLETED' OR (pkce_cleanup_result IS NOT NULL AND pkce_cleanup_result IN ('CONFIRMED','NOT_APPLICABLE'))
  - name: github_authorization_attempts_object_ref_ck
