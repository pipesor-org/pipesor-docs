  - name: created_at
    type: timestamptz
    pk: false
    nullable: false
    unique: false
    er_visible: false
    assumption: A-002
    description_es: Instante de persistencia; permite aplicar retención cuando corresponde.
    source:
    - SRC_ADR_013
