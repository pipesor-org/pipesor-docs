  - name: signals
    type: jsonb
    pk: false
    nullable: false
    unique: false
    er_visible: false
    assumption: null
    description_es: 'Array ordenado de señales protegidas tipadas: evidence_id, origin_context_id, correlation_id, stage, summary y content. Sin request crudo ni claves adicionales.'
  - name: created_at
    type: timestamptz
    pk: false
    nullable: false
    unique: false
    er_visible: false
