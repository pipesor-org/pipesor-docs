  retention_policy: null
  checks:
  - name: incident_diagnoses_version_ck
    expression: diagnosis_version > 0
  - name: incident_diagnoses_status_ck
    expression: status IN ('PENDING','CONFIRMED','CORRECTED','REJECTED')
  - name: incident_diagnoses_review_ck
