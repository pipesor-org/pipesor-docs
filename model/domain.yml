# SSOT del dominio persistente. DBML/SQL/ER/diccionario se generan; no editar derivados.
model_version: 1.10.0
source_authority:
  scope: SRC_CHARTER
  architecture:
  - architecture.yml#architectural_invariants
  - Accepted ADRs
  - architecture.yml
  technology:
  - SRC_DRIFT
  - Accepted technology ADRs
  functionality: docs/research/arquitectura-informacion.md
  rule: Autoridad por materia; IA no amplía Charter ni contradice ADR/INV.
schemas:
- id: ops
  owner_containers:
  - pipeline_service
  description_es: Operación de workflows e incidentes.
- id: evidence
  owner_containers:
  - log_event_service
  - evidence_correlation_engine
  description_es: Evidencia normalizada y contexto; ownership por tabla.
- id: diagnosis
  owner_containers:
  - recommendation_service
  description_es: Diagnósticos, recomendaciones y revisión.
- id: knowledge
  owner_containers:
  - rag_retrieval
  description_es: Corpus autorizado recuperable.
- id: audit
  owner_containers:
  - shared
  description_es: Auditoría transversal funcional.
- id: ingestion
  owner_containers:
  - ingestion_normalization_service
  description_es: Metadata de conector GitHub (DD-020), ledger de captura/publicación y buffer temporal de bytes protegidos (DD-021), intentos de inicio de sesión, admisiones de repositorios y alcances de captura por workflow (DD-026); sin credenciales ni entradas crudas.
entities:
- id: repositories
  table: repositories
  schema: ops
  owner_container: pipeline_service
  description_es: Repositorio GitHub autorizado; entidad distinta del workflow monitorizado.
  scope_basis: approved_domain
  status: confirmed
  source:
  - SRC_CHARTER#Alcance-del-Proyecto
  - architecture.yml#github
  - DD-001
  attributes:
  - name: id
    type: uuid
    pk: true
    nullable: false
    unique: false
    er_visible: true
    assumption: A-001
    description_es: Identificador estable asignado por el servicio propietario.
  - name: github_repository_id
    type: text
    pk: false
    nullable: false
    unique: true
    er_visible: true
    assumption: A-003
    description_es: ID externo del repositorio GitHub.
  - name: full_name
    type: text
    pk: false
    nullable: false
    unique: false
    er_visible: false
    assumption: null
    description_es: Nombre owner/repository para presentación.
  - name: default_branch
    type: text
    pk: false
    nullable: true
    unique: false
    er_visible: false
    assumption: null
    description_es: Rama por defecto suministrada por GitHub.
  - name: created_at
    type: timestamptz
    pk: false
    nullable: false
    unique: false
    er_visible: false
    assumption: A-002
    description_es: Instante de persistencia; permite aplicar retención cuando corresponde.
    source:
    - SRC_ADR_013
    - DD-015
  traceability_required: false
  retention_policy: null
