  checks:
  - name: github_credential_operations_kind_ck
    expression: kind IN ('REFRESH','CLEANUP')
  - name: github_credential_operations_phase_ck
    expression: (kind = 'REFRESH' AND phase IN ('PENDING','CLAIMED','REQUEST_MAY_BE_IN_FLIGHT','VERSION_SAVED','COMPLETED','BLOCKED')) OR (kind = 'CLEANUP' AND phase IN ('PENDING','CLAIMED','COMPLETED','BLOCKED'))
  - name: github_credential_operations_revision_ck
    expression: fence >= 0 AND expected_connection_revision >= 0 AND expected_generation_revision >= 0
  - name: github_credential_operations_claim_ck
    expression: (phase = 'PENDING' AND owner_id IS NULL AND started_at IS NULL AND deadline_at IS NULL) OR (phase <> 'PENDING' AND owner_id IS NOT NULL AND started_at IS NOT NULL AND deadline_at IS NOT NULL AND deadline_at >= started_at)
  - name: github_credential_operations_completion_ck
    expression: (phase = 'COMPLETED') = (completed_at IS NOT NULL)
  - name: github_credential_operations_kind_fields_ck
    expression: (kind = 'REFRESH' AND cleanup_scope IS NULL AND cleanup_target_version_ref IS NULL AND upstream_result IS NULL AND vault_result IS NULL) OR (kind = 'CLEANUP' AND candidate_secret_version_ref IS NULL AND cleanup_scope IS NOT NULL AND cleanup_scope IN ('EXACT_VERSION','INVALIDATED_GENERATION') AND upstream_result IS NOT NULL AND upstream_result IN ('PENDING','CONFIRMED','UNAVAILABLE','SCOPE_UNAPPROVED','NOT_APPLICABLE') AND vault_result IS NOT NULL AND vault_result IN ('PENDING','CONFIRMED','UNAVAILABLE','SCOPE_UNAPPROVED','NOT_APPLICABLE'))
  - name: github_credential_operations_cleanup_target_ck
    expression: kind <> 'CLEANUP' OR ((cleanup_scope = 'EXACT_VERSION' AND cleanup_target_version_ref IS NOT NULL) OR (cleanup_scope = 'INVALIDATED_GENERATION' AND cleanup_target_version_ref IS NULL))
  - name: github_credential_operations_exact_versions_ck
    expression: (candidate_secret_version_ref IS NULL OR (btrim(candidate_secret_version_ref) <> '' AND lower(btrim(candidate_secret_version_ref)) <> 'latest')) AND (cleanup_target_version_ref IS NULL OR (btrim(cleanup_target_version_ref) <> '' AND lower(btrim(cleanup_target_version_ref)) <> 'latest'))
  - name: github_credential_operations_candidate_version_ck
    expression: kind <> 'REFRESH' OR phase NOT IN ('VERSION_SAVED','COMPLETED') OR candidate_secret_version_ref IS NOT NULL
  - name: github_credential_operations_cleanup_complete_ck
    expression: kind <> 'CLEANUP' OR phase <> 'COMPLETED' OR (upstream_result IN ('CONFIRMED','NOT_APPLICABLE') AND vault_result IN ('CONFIRMED','NOT_APPLICABLE'))
  - name: github_credential_operations_timestamps_ck
    expression: updated_at >= created_at
  foreign_keys:
  - name: github_operations_generation_fk
    columns:
    - connection_id
    - generation_id
    references:
      table: ingestion.github_connection_generations
      columns:
      - connection_id
      - id
    deferrable: true
    initially_deferred: true
