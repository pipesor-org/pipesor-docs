    description_es: Instante UTC de aceptación durable por Recommendation.
  traceability_required: true
  retention_policy: RET-001
  checks:
  - name: correlated_context_receipts_identity_ck
    expression: operation_id = context_id
  - name: correlated_context_receipts_fingerprint_ck
    expression: request_fingerprint ~ '^v1:sha256:[0-9a-f]{64}$'
  - name: correlated_context_receipts_installation_ck
    expression: github_installation_id ~ '^[1-9][0-9]{0,31}$'
  - name: correlated_context_receipts_repository_ck
    expression: github_repository_id ~ '^[1-9][0-9]{0,31}$'
  - name: correlated_context_receipts_scope_ck
    expression: scope_revision ~ '^[A-Za-z0-9._:-]{1,128}$'
  - name: correlated_context_receipts_evidence_ck
    expression: cardinality(evidence_ids) > 0
  - name: correlated_context_receipts_summary_ck
    expression: btrim(summary) <> ''
  - name: correlated_context_receipts_correlation_ck
    expression: correlation_id ~ '^[A-Za-z0-9._:-]{1,128}$'
  - name: correlated_context_receipts_signals_shape_ck
    expression: CASE WHEN jsonb_typeof(signals) = 'array' THEN jsonb_array_length(signals) > 0 AND jsonb_array_length(signals) = cardinality(evidence_ids) ELSE false END
  domain_constraints:
  - append_only
