    REJECTED.'
  scope_basis: approved_domain
  status: confirmed
  source: &id013
  - SRC_ADR_011
  - SRC_ADR_016
  - architecture.yml#INV-006
  - SRC_ADR_013
  - DD-005
  attributes:
  - name: id
    type: uuid
    pk: true
    nullable: false
    unique: false
    er_visible: true
    assumption: A-001
    description_es: Identificador estable asignado por el servicio propietario.
  - name: diagnostic_id
    type: uuid
    pk: false
    nullable: false
    unique: false
    er_visible: true
    assumption: null
    description_es: Versión revisada; conserva el nombre contractual diagnostic_id de ADR-011.
    fk: diagnosis.diagnoses.id
  - name: revision
    type: integer
    pk: false
    nullable: false
    unique: false
    er_visible: true
    assumption: null
    description_es: Revisión positiva de la revisión humana, única por diagnóstico.
    source:
    - 'pipesor-recommendation-service@3d53d26: V2__persist_diagnostic_reviews.sql'
    - DD-027
  - name: reviewer_ref
    type: text
    pk: false
    nullable: false
    unique: false
    er_visible: false
    assumption: null
    description_es: Identidad externa del revisor corporativo; mapea reviewer del contrato.
  - name: decision
    type: text
    pk: false
    nullable: false
    unique: false
    er_visible: true
    assumption: null
    description_es: CONFIRMED acepta; CORRECTED aporta causa corregida; REJECTED rechaza sin alternativa
      validada.
    enum: HumanReviewDecision
  - name: timestamp
    type: timestamptz
    pk: false
    nullable: false
    unique: false
    er_visible: false
    assumption: A-002
    description_es: Instante de revisión del contrato.
  - name: correlation_id
    type: text
    pk: false
    nullable: false
    unique: false
    er_visible: true
    assumption: null
    description_es: Identificador de correlación end-to-end; no contiene información sensible.
    source:
    - architecture.yml#CTRL-003
  - name: actual_cause
    type: text
    pk: false
    nullable: true
    unique: false
    er_visible: false
    assumption: null
    description_es: Causa corregida suministrada por el revisor; requerida semánticamente en CORRECTED.
  - name: comment
    type: text
    pk: false
    nullable: true
    unique: false
    er_visible: false
    assumption: null
    description_es: Comentario saneado del revisor.
  - name: corrected_recommendation
    type: text
    pk: false
    nullable: true
    unique: false
    er_visible: false
    assumption: null
    description_es: Recomendación corregida opcional; solo admitida en CORRECTED.
    source:
    - 'pipesor-recommendation-service@3d53d26: V2__persist_diagnostic_reviews.sql'
    - DD-027
  - name: created_at
    type: timestamptz
    pk: false
    nullable: false
    unique: false
    er_visible: false
    assumption: A-002
    description_es: Instante de persistencia; permite aplicar retención cuando corresponde.
    source:
    - SRC_ADR_013
    - DD-015
  traceability_required: true
  retention_policy: RET-001
  unique_constraints:
  - columns:
    - diagnostic_id
    - revision
    name: human_reviews_diagnostic_id_revision_key
  checks:
  - name: human_reviews_check_1
    expression: decision <> 'CORRECTED' OR (actual_cause IS NOT NULL AND btrim(actual_cause) <> '')
  - name: human_reviews_revision_check
    expression: revision > 0
  - name: human_reviews_check
    expression: (decision = 'CORRECTED' AND actual_cause IS NOT NULL AND btrim(actual_cause) <> '' AND
      (corrected_recommendation IS NULL OR btrim(corrected_recommendation) <> '')) OR (decision <> 'CORRECTED'
      AND actual_cause IS NULL AND corrected_recommendation IS NULL)
- id: diagnosis_jobs
  table: diagnosis_jobs
  schema: diagnosis
  owner_container: recommendation_service
  description_es: Cola técnica durable del diagnóstico automático; un trabajo por recepción de contexto,
    con lease y reintentos, sin evidencia ni payloads.
  scope_basis: approved_domain
  status: inferred
  source:
  - architecture.yml#recommendation_service
  - SRC_ADR_015
  - 'pipesor-recommendation-service@3d53d26: docs/diagnosis-worker.md, V7__create_diagnosis_jobs.sql'
  - DD-026
  attributes:
  - name: context_id
    type: uuid
    pk: true
    nullable: false
    unique: false
    er_visible: true
    assumption: null
    description_es: Recepción de contexto a diagnosticar; FK intra-schema a su recibo.
    fk: diagnosis.correlated_context_receipts.context_id
  - name: state
    type: text
    pk: false
    nullable: false
    unique: false
    er_visible: true
    assumption: null
    description_es: 'Estado del trabajo: PENDING, DONE o FAILED.'
  - name: attempts
    type: integer
    pk: false
    nullable: false
    unique: false
    er_visible: false
    assumption: null
    description_es: Intentos reclamados; no negativo.
  - name: next_attempt_at
    type: timestamptz
    pk: false
    nullable: false
    unique: false
    er_visible: false
    assumption: null
    description_es: Instante desde el que el trabajo puede reclamarse.
  - name: lease_until
    type: timestamptz
    pk: false
    nullable: true
    unique: false
    er_visible: false
    assumption: null
    description_es: Fin del lease del worker que lo reclamó; solo en PENDING.
  - name: last_failure
    type: text
    pk: false
    nullable: true
    unique: false
    er_visible: false
    assumption: null
    description_es: Código corto del último fallo; sin mensajes, evidencia ni respuestas del proveedor.
  - name: created_at
    type: timestamptz
    pk: false
    nullable: false
    unique: false
    er_visible: false
    assumption: A-002
    description_es: Instante de creación del trabajo; sin política de purga.
  traceability_required: false
  retention_policy: null
  checks:
  - name: diagnosis_jobs_state_check
    expression: state IN ('PENDING','DONE','FAILED')
  - name: diagnosis_jobs_attempts_check
    expression: attempts >= 0
  - name: diagnosis_jobs_last_failure_check
    expression: last_failure IS NULL OR last_failure ~ '^[a-z][a-z0-9_]{0,63}$'
  - name: diagnosis_jobs_check
    expression: state = 'PENDING' OR lease_until IS NULL
