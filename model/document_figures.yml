    call: "La Figura N sitúa el prototipo frente a las personas y los sistemas con los que interactúa. Conviene observar que GitHub Actions es a la vez fuente de evidencia y consumidor del informe de diagnóstico, y que la telemetría de observabilidad sigue siendo una propuesta."
