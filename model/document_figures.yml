    sequence: seq_a3_review
    orientation: portrait
    destination: {documents: [Memoria, Capstone], section: "Implementación: flujo de diagnóstico de un fallo (a confirmar por el equipo)"}
    title: "Revisión humana del diagnóstico desde el dashboard"
    note: "*Nota.* Elaboración propia a partir del modelo de secuencias y del código de los servicios. Todo está implementado; las flechas discontinuas son respuestas. Se omiten la reproyección del resumen en Pipeline y la consulta del informe desde GitHub Actions. El detalle completo está en el repositorio pipesor-docs (Anexo C)."
    call: "La Figura N muestra cómo una persona revisa el diagnóstico desde el dashboard. Conviene observar que cada lectura comprueba los permisos en Pipeline y que una revisión concurrente se rechaza con un conflicto en lugar de sobrescribirse."
    alt: "Secuencia de revisión humana: dashboard, permisos en Pipeline y registro de la revisión con control de conflictos."
