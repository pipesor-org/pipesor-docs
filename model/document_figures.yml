  - id: clases-operacion
    folder: 03-clases
    order: 6
    kind: classes
    container: pipeline_service
    orientation: portrait
    destination: {documents: [Memoria], section: "Diseño de la solución: modelo de dominio (a confirmar por el equipo)"}
    title: "Agregado Incident del contexto de operación (Pipeline)"
    note: "*Nota.* Elaboración propia a partir del código del servicio Pipeline. Todas las clases están implementadas. Se muestran solo el agregado, sus entidades y value objects clave, con atributos y reglas seleccionados. El detalle completo está en el repositorio pipesor-docs (Anexo C)."
    call: "La Figura N presenta el agregado Incident, que concentra las reglas del ciclo de vida de un incidente. El lector puede observar que el origen es siempre una ejecución fallida y que las transiciones de estado se validan dentro del agregado."
    alt: "Clases del agregado Incident: detalles, ciclo de vida, ejecución de origen, verificación, estado, severidad y repositorio."
    simplifications:
      - "Se omiten puertos, adaptadores y filas JPA (IncidentStore, JpaIncidentStore e IncidentJpaEntity)."
      - "Se muestran hasta seis atributos por clase y solo los métodos que expresan reglas de negocio."
    classes:
      Incident: {attributes: [id, pipelineId, origin, details, lifecycle], methods: [fromFailedExecution, transition]}
      IncidentDetails: {attributes: [stage, summary, detectedAt, severity]}
      IncidentLifecycle: {attributes: [status, remediationStartedAt, resolvedAt, verificationExecutionIds]}
      ExecutionOutcome: {attributes: [executionId, pipelineId, failed]}
      VerificationExecution: {attributes: [id, status, conclusion], methods: [successful]}
      IncidentStatus: {}
      Severity: {methods: [initialFor]}
      GitHubRepository: {attributes: [id, githubRepositoryId, fullName, defaultBranch]}
    relationship_labels:
      Incident>IncidentDetails: "detalles"
      Incident>IncidentLifecycle: "ciclo de vida"
      Incident>ExecutionOutcome: "origen"
      Incident>VerificationExecution: "verifica"
      IncidentDetails>Severity: "severidad"
      IncidentLifecycle>IncidentStatus: "estado"

  - id: clases-ingesta
    folder: 03-clases
    order: 7
    kind: classes
    container: ingestion_normalization_service
    orientation: portrait
    destination: {documents: [Memoria], section: "Diseño de la solución: modelo de dominio (a confirmar por el equipo)"}
    title: "Agregados GitHubConnection y CaptureReceipt del contexto de ingesta"
    note: "*Nota.* Elaboración propia a partir del código del servicio de ingesta. Todas las clases están implementadas. Se muestran los dos agregados con sus entidades y value objects clave; se omiten operaciones de credenciales, enumeraciones y persistencia. El detalle completo está en el repositorio pipesor-docs (Anexo C)."
    call: "La Figura N reúne los dos agregados del servicio de ingesta. GitHubConnection gobierna el vínculo del usuario con GitHub por generaciones de credenciales, y CaptureReceipt garantiza que cada evento capturado deje un recibo durable con su ámbito."
    alt: "Clases de ingesta: GitHubConnection con raíz, generaciones e intentos; CaptureReceipt con ámbito y observación del workflow."
    simplifications:
      - "Se omiten las operaciones de credenciales (ConnectionRecords.Operation), los value objects de identidad y secreto y las demás enumeraciones."
      - "WorkflowObservation se muestra sin sus records anidados (contexto, ejecución, etapas, fallo y evidencia)."
      - "Se omiten puertos, adaptadores y filas JPA."
    classes:
      GitHubConnection: {attributes: [id, root, generations, attempts], methods: [prepare, claim, activate]}
      ConnectionRoot: {attributes: [id, identity, revision, activeGenerationId]}
      ConnectionGeneration: {attributes: [id, githubUserId, state, accessExpiresAt, refreshExpiresAt]}
      ConnectionAttempt: {attributes: [id, stateDigest, expiresAt, phase]}
      GenerationState: {}
      CaptureReceipt: {attributes: [id, scope, runId, runAttempt, phase, observationId], methods: [requireClaim, requirePreparedObservation]}
      CaptureScope: {attributes: [tenantId, installationId, repositoryId, workflowId, scopeRevision]}
      WorkflowObservation: {attributes: [execution, commitSha, correlationId, sourceUpdatedAt]}
    relationship_labels:
      GitHubConnection>ConnectionRoot: "raíz"
      GitHubConnection>ConnectionGeneration: "generaciones"
      GitHubConnection>ConnectionAttempt: "intentos"
      ConnectionGeneration>GenerationState: "estado"
      CaptureReceipt>CaptureScope: "ámbito"
      CaptureReceipt>WorkflowObservation: "observación"

  - id: clases-correlacion
    folder: 03-clases
    order: 8
    kind: classes
