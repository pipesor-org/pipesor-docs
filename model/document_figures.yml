# Figuras documentales para la Memoria de Tesis y el Capstone (APA 7, Word).
#
# Pedidas por el responsable el 27/11/2026: un segundo nivel de figuras, generado desde los mismos
# modelos, con una figura por página (A4 vertical 15,9 × 19,0 cm como máximo), texto de 9 pt o más,
# etiquetas en español y sin título, notas ni referencias técnicas dentro de la imagen. Las vistas
# técnicas completas de out/*.svg y out/trazabilidad.md siguen siendo el respaldo.
#
# Modelo de presentación. Solo selecciona y rotula en español hechos ya modelados: cada nodo,
# relación, clase, tabla o nodo de despliegue se cita por su ID en architecture.yml, design.yml,
# domain.yml, sequence_presentation.yml o deployment_presentation.yml, y el estado de implementación
# se deriva del overlay (model/implementation_status.yml) o de design.yml; aquí no se declara.
# No crea arquitectura, no cambia status ni source y no resuelve preguntas abiertas ni hallazgos.
#
# Estados (tres como máximo): implementado; parcial (en parte o de otra forma que el modelo);
# propuesto (modelado, sin implementar).
model_version: "1.0.0"
authorization:
  date: "2026-11-27"
  requested_by: responsable del proyecto
  scope: "Figuras documentales en out/figuras/ (sustituyen a out/doc/)"
sources:
  architecture: model/architecture.yml
  design: model/design.yml
  domain: model/domain.yml
  sequences: model/sequence_presentation.yml
  deployment: model/deployment_presentation.yml
  overlay: model/implementation_status.yml
annex: "repositorio pipesor-docs (Anexo C)"

folders:
  01-contexto-contenedores: "Contexto y contenedores (C4, niveles 1 y 2)"
  02-componentes: "Componentes (C4, nivel 3)"
  03-clases: "Clases de dominio por bounded context"
  04-datos: "Modelo de datos por esquema"
  05-secuencias: "Secuencias"
  06-despliegue: "Despliegue y estrategia de ramas"

