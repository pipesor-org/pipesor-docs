  # ------------------------------------------------------------------------------------------------
  - id: secuencia-captura-fallo
    folder: 05-secuencias
    order: 15
    kind: sequence
    sequence: seq_a1_capture
    max_message_width: 85
    orientation: portrait
    destination: {documents: [Memoria, Capstone], section: "Implementación: flujo de diagnóstico de un fallo (a confirmar por el equipo)"}
    title: "Captura de un fallo de GitHub Actions hasta la entrega del contexto"
    note: "*Nota.* Elaboración propia a partir del modelo de secuencias y del código. Todo está implementado; flechas discontinuas: respuestas; de punta abierta: mensajes asíncronos. Service Bus y NLP se indican en el mensaje; Log/Event, los reintentos y la idempotencia se omiten. El detalle completo está en el repositorio pipesor-docs (Anexo C)."
    call: "La Figura N recorre la captura de un fallo desde el webhook firmado hasta la entrega del contexto correlacionado. Conviene observar que GitHub recibe la respuesta en cuanto existe un recibo durable y que el resto del proceso continúa de forma asíncrona."
    alt: "Secuencia de captura: webhook, recibo, lectura de logs, Service Bus, NLP, correlación y entrega al diagnóstico."
    simplifications:
      - "Log/Event, que registra la evidencia en paralelo, no se dibuja."
      - "Service Bus y NLP no tienen línea de vida: los mensajes asíncronos indican por dónde pasan."
      - "Si la ejecución aún no está registrada, Correlation responde 503 y NLP reintenta; se explica en el texto."
      - "Los reintentos por lease, la deduplicación por digest y los mensajes a dead-letter se explican en el texto."
    participants:
      - {id: gha, name: "GitHub Actions", element: github_actions}
      - {id: ing, name: "Ingesta", element: ingestion_normalization_service}
      - {id: pip, name: "Pipeline", element: pipeline_service}
      - {id: cor, name: "Correlación", element: evidence_correlation_engine}
      - {id: rec, name: "Diagnóstico", element: recommendation_service}
    steps:
      - {message: {from: gha, to: ing, text: "POST webhook workflow_run firmado", relationship: rel_github_actions_ingestion_event}}
      - fragment:
          kind: alt
          branches:
            - guard: "firma inválida"
              steps:
                - {message: {from: ing, to: gha, style: reply, text: "403, sin registro", relationship: rel_github_actions_ingestion_event}}
            - guard: "admitido"
              steps:
                - {message: {from: ing, to: gha, style: reply, text: "204 tras guardar un recibo durable", relationship: rel_github_actions_ingestion_event}}
      - {message: {from: ing, to: gha, text: "Lee run, jobs y logs", relationship: rel_ingestion_github_actions_read}}
      - {message: {from: ing, to: ing, style: self, text: "Normaliza y enmascara la evidencia", relationship: rel_ingestion_postgresql_connector_metadata}}
      - {message: {from: ing, to: pip, style: async, text: "Snapshot vía Service Bus", relationships: [rel_ingestion_service_bus, rel_service_bus_pipeline_service]}}
      - {message: {from: pip, to: pip, style: self, text: "Abre el incidente", relationship: rel_pipeline_service_postgresql}}
      - {message: {from: ing, to: cor, style: async, text: "Evidencia vía Service Bus y NLP", relationships: [rel_ingestion_service_bus, rel_service_bus_nlp, rel_nlp_correlation]}}
      - {message: {from: cor, to: pip, text: "Verifica el incidente ORIGIN", relationship: rel_correlation_pipeline_operational_references}}
      - {message: {from: cor, to: rec, text: "POST contexto; se encola el diagnóstico", relationship: rel_correlation_recommendation}}

  - id: secuencia-diagnostico
    folder: 05-secuencias
    order: 16
    kind: sequence
    sequence: seq_a2_diagnosis
    max_message_width: 110
    orientation: portrait
    destination: {documents: [Memoria, Capstone], section: "Implementación: flujo de diagnóstico de un fallo (a confirmar por el equipo)"}
    title: "Diagnóstico asistido con recuperación RAG e inferencia en Azure OpenAI"
    note: "*Nota.* Elaboración propia a partir del modelo de secuencias y del código de los servicios. Flechas negras: implementado; ámbar: parcial, es decir, implementado de otra forma que el diseño; discontinuas: respuestas. Los reintentos con espera exponencial se explican en el texto. El detalle completo está en el repositorio pipesor-docs (Anexo C)."
    call: "La Figura N muestra cómo el servicio de diagnóstico procesa un contexto encolado. Lo importante es que la consulta al RAG y la inferencia ocurren en un worker asíncrono, y que el resumen llega a Pipeline mediante un outbox y no en la misma llamada."
    alt: "Secuencia de diagnóstico: trabajo encolado, consulta RAG, inferencia, persistencia y resumen enviado a Pipeline."
    simplifications:
      - "El worker y el outbox se representan dentro del servicio de diagnóstico."
      - "La validación de las citas de evidencia antes de guardar se explica en el texto."
      - "Los reintentos (hasta ocho, con espera exponencial) y el estado FAILED se explican en el texto y no se dibujan."
    participants:
      - {id: rec, name: "Diagnóstico", element: recommendation_service}
      - {id: rag, name: "RAG", element: rag_retrieval}
      - {id: aoai, name: "Azure OpenAI", element: pretrained_llm_diagnostic_service}
      - {id: pg, name: "PostgreSQL", element: postgresql_operational_store}
      - {id: pip, name: "Pipeline", element: pipeline_service}
    steps:
      - {message: {from: rec, to: pg, text: "Reclama un trabajo de diagnóstico", relationship: rel_recommendation_service_postgresql}}
      - {message: {from: rec, to: rag, text: "POST consulta de conocimiento", relationship: rel_recommendation_rag}}
      - {message: {from: rag, to: aoai, text: "Embedding de la consulta", relationship: rel_rag_embeddings}}
      - {message: {from: rag, to: pg, text: "Búsqueda por similitud en pgvector", relationship: rel_rag_pgvector}}
      - fragment:
          kind: alt
          branches:
            - guard: "hay coincidencias"
              steps:
                - {message: {from: rag, to: rec, style: reply, text: "Fragmentos con procedencia", relationship: rel_recommendation_rag}}
            - guard: "sin coincidencias"
              steps:
                - {message: {from: rag, to: rec, style: reply, text: "no_match: inferencia sin conocimiento", relationship: rel_recommendation_rag}}
      - {message: {from: rec, to: aoai, text: "Chat completion con esquema JSON estricto", relationship: rel_recommendation_llm}}
      - {message: {from: aoai, to: rec, style: reply, text: "Hipótesis: causa, recomendación y citas", relationship: rel_recommendation_llm}}
      - {message: {from: rec, to: pg, text: "Guarda el diagnóstico y el outbox", relationship: rel_recommendation_service_postgresql}}
      - {message: {from: rec, to: pip, text: "PUT resumen del diagnóstico", relationship: rel_recommendation_pipeline_diagnosis_summary}}

  - id: secuencia-revision-humana
    folder: 05-secuencias
    order: 17
