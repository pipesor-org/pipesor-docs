    title: "Agregados propuestos del diagnóstico frente a los registros implementados"
    note: "*Nota.* Elaboración propia a partir del diseño de clases propuesto y del código del servicio de diagnóstico. Borde continuo: implementado; ámbar discontinuo: parcial; rojo punteado: propuesto. La línea discontinua con triángulo indica qué registro realiza cada agregado propuesto. El detalle completo está en el repositorio pipesor-docs (Anexo C)."
    call: "La Figura N contrasta los agregados Diagnosis y HumanReview del diseño con los registros que implementa el código. El lector debe observar que el diagnóstico se guarda como una instantánea JSON y que la recomendación y la causa probable no existen como clases propias."
    alt: "Clases propuestas Diagnosis, Recommendation, ProbableCause y HumanReview frente a los registros implementados."
    simplifications:
      - "Se omiten los records de recibos, trabajos de diagnóstico y outbox, y los controladores y servicios de aplicación."
      - "Se muestran hasta seis atributos por clase."
    classes:
      Diagnosis: {attributes: [id, incidentId, version, status, probableCause, confidence], methods: [assertReadySnapshot]}
      Recommendation: {attributes: [id, diagnosisId, description, critical]}
      ProbableCause: {attributes: [value]}
      HumanReview: {attributes: [id, diagnosticId, revision, decision, actualCause, comment], methods: [record, validateDecision]}
      HumanReviewDecision: {}
      OrchestratorDiagnosis: {attributes: [contextId, executionId, incidentId, hypothesis, evidence, sources]}
      OrchestratorHypothesis: {attributes: [probableCause, recommendation, limitations, evidenceIds, chunkIds]}
      ReviewRecord: {attributes: [id, revision, reviewer, decision, actualCause, comment]}
    relationship_labels:
      Diagnosis>Recommendation: "recomendaciones"
      Diagnosis>ProbableCause: "hipótesis"
      HumanReview>HumanReviewDecision: "decisión"
      OrchestratorDiagnosis>OrchestratorHypothesis: "hipótesis"
      OrchestratorDiagnosis>Diagnosis: "realiza"
      ReviewRecord>HumanReview: "realiza"

