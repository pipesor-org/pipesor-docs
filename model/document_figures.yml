      - "La reproyección del resumen en Pipeline tras la revisión se explica en el texto."
    participants:
      - {id: user, name: "Usuario técnico", element: technical_users}
      - {id: dash, name: "Dashboard", element: web_dashboard}
      - {id: rec, name: "Diagnóstico", element: recommendation_service}
      - {id: pip, name: "Pipeline", element: pipeline_service}
    steps:
      - {message: {from: dash, to: pip, text: "GET cola de incidentes", relationship: rel_dashboard_pipeline_service}}
      - {message: {from: dash, to: rec, text: "GET diagnóstico del incidente", relationship: rel_dashboard_recommendation_service}}
      - {message: {from: rec, to: pip, text: "Resuelve el permiso de lectura", relationship: rel_recommendation_pipeline_diagnosis_entitlement}}
      - {message: {from: rec, to: dash, style: reply, text: "Causa, evidencia y fuentes", relationship: rel_dashboard_recommendation_service}}
      - {message: {from: user, to: dash, text: "Confirma o corrige la causa", relationship: rel_technical_users_dashboard}}
      - {message: {from: dash, to: rec, text: "POST revisión con revisión esperada", relationship: rel_dashboard_recommendation_service}}
      - fragment:
          kind: alt
          branches:
            - guard: "otra revisión antes"
              steps:
                - {message: {from: rec, to: dash, style: reply, text: "409: el dashboard recarga", relationship: rel_dashboard_recommendation_service}}
            - guard: "revisión vigente"
              steps:
                - {message: {from: rec, to: rec, style: self, text: "Guarda la revisión y el outbox", relationship: rel_human_review_postgresql}}
