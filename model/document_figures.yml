  - id: secuencia-inicio-sesion
    folder: 05-secuencias
    order: 18
    kind: sequence
    sequence: seq_b_login
    max_message_width: 150
    orientation: portrait
    destination: {documents: [Memoria, Capstone], section: "Implementación: seguridad e identidad (a confirmar por el equipo)"}
    title: "Inicio de sesión con GitHub mediante OAuth y PKCE"
    note: "*Nota.* Elaboración propia a partir del modelo de secuencias y del código de ingesta y del dashboard. Flechas negras: implementado; discontinuas: respuestas o redirecciones. Se omiten la custodia del verifier, el registro del intento y el cierre de sesión. El detalle completo está en el repositorio pipesor-docs (Anexo C)."
    call: "La Figura N describe el inicio de sesión con GitHub. El lector debe observar que el consentimiento se exige antes de redirigir a GitHub, que el código se canjea con el verifier PKCE y que el dashboard recibe un token de sesión firmado con una clave de Key Vault."
    alt: "Secuencia de inicio de sesión: consentimiento, autorización en GitHub con PKCE, canje del código y token de sesión firmado."
    simplifications:
      - "Se omiten la custodia del verifier en Key Vault, los registros de intento en PostgreSQL y el cierre de sesión."
      - "Las redirecciones del navegador se dibujan como mensajes entre el dashboard, la ingesta y GitHub."
      - "El uso posterior del token contra Pipeline y Diagnóstico, validado con JWKS, se explica en el texto."
      - "La casilla de consentimiento del dashboard se representa por el parámetro consent_version."
    participants:
      - {id: dash, name: "Dashboard", element: web_dashboard}
      - {id: ing, name: "Ingesta", element: ingestion_normalization_service}
      - {id: gh, name: "GitHub", element: github}
      - {id: kv, name: "Key Vault", element: azure_key_vault}
    steps:
      - {message: {from: dash, to: ing, text: "GET start con consent_version", relationship: rel_dashboard_ingestion_github_connection}}
      - fragment:
          kind: alt
          branches:
            - guard: "falta el consentimiento"
              steps:
                - {message: {from: ing, to: dash, style: reply, text: "Redirige con error=consent_required", relationship: rel_dashboard_ingestion_github_connection}}
            - guard: "consentimiento válido"
              steps:
                - {message: {from: ing, to: gh, style: reply, text: "Redirige a authorize con PKCE S256", relationship: rel_ingestion_github_connection}}
      - {message: {from: gh, to: ing, style: reply, text: "Callback con code y state", relationship: rel_ingestion_github_connection}}
      - {message: {from: ing, to: gh, text: "Canjea el código con el verifier", relationship: rel_ingestion_github_connection}}
      - {message: {from: ing, to: gh, text: "Verifica identidad e instalaciones", relationship: rel_ingestion_github_connection}}
      - {message: {from: ing, to: ing, style: self, text: "Activa el vínculo y registra el consentimiento", relationship: rel_ingestion_postgresql_connector_metadata}}
      - {message: {from: ing, to: dash, style: reply, text: "Redirige con un handoff de un uso", relationship: rel_dashboard_ingestion_github_connection}}
      - {message: {from: dash, to: ing, text: "POST sesión con el handoff", relationship: rel_dashboard_ingestion_github_connection}}
      - {message: {from: ing, to: kv, text: "Firma el token de sesión", relationship: rel_ingestion_key_vault}}
      - {message: {from: ing, to: dash, style: reply, text: "Token de sesión de una hora", relationship: rel_dashboard_ingestion_github_connection}}

