      CorrelationContribution: {attributes: [producerKey, messageId, evidenceId, inputFingerprint, signal, scope]}
      EvidenceSignal: {attributes: [stage, summary, content, sourceLocator]}
      ScopeEnvelope: {attributes: [tenantId, installationId, repositoryId, pipelineId, revision], methods: [sameResource]}
    relationship_labels:
      CorrelationGroup>CorrelationContext: "contexto"
      CorrelationContribution>CorrelationContext: "contexto"
      CorrelationContribution>EvidenceSignal: "señal"
      CorrelationContribution>ScopeEnvelope: "ámbito"

