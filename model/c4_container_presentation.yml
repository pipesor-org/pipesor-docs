      Ingesta; ADR-022) y consume APIs mediante ingress nativo de ACA. Pipeline, Log/Event y diagnóstico conservan los datos
      y la revisión humana en PostgreSQL; Log/Event conserva evidencia saneada en PostgreSQL; los logs originales permanecen en GitHub Actions.
