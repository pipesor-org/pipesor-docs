    implementation:
      status: divergent
      evidence:
        - recommendation:src/main/java/com/pipesor/recommendation/diagnosis/application/commandhandlers/DiagnoseAdmittedContextsHandler.java:23
        - recommendation:src/main/java/com/pipesor/recommendation/diagnosis/application/commandhandlers/DiagnoseAdmittedContextsHandler.java:60-64
        - recommendation:src/main/java/com/pipesor/recommendation/diagnosis/review/PersistedDiagnosticWorkflow.java:18-40
        - recommendation:src/main/java/com/pipesor/recommendation/diagnosis/infrastructure/DiagnosisWorker.java:18
      note: "Asynchronous: DiagnosisWorker (SmartLifecycle) polls diagnosis_jobs; DiagnoseAdmittedContextsHandler rebuilds the admitted context and PersistedDiagnosticWorkflow diagnoses and admits it."
  - id: GetDiagnosisQuery
    name: GetDiagnosisQuery
    package: domain.model.queries
    layer: domain
    stereotype: Query
    status: proposed
    component_realized: diagnostic_api_component
    attributes:
