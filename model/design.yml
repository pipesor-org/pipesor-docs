      - {suffix: e, title: corpus import, elements: [PreparedDocument, CorpusImport, RagAuthorizationScope, RagCorpusKind]}

classes:
  - id: DiagnosisCommandController
    name: DiagnosisCommandController
    package: interfaces.rest
    layer: interfaces
    stereotype: Controller
    status: proposed
    component_realized: diagnostic_api_component
    attributes: []
    methods:
      - {name: receiveCorrelatedContext, parameters: [], returns: UUID, effect: write}
    ingress:
      architecture_relationship: rel_correlation_diagnostic_api
      protocol: REST/HTTPS
    implementation:
      status: divergent
      evidence:
        - recommendation:src/main/java/com/pipesor/recommendation/receipt/interfaces/rest/CorrelatedContextController.java:29-42
        - recommendation:src/main/java/com/pipesor/recommendation/receipt/ReceiptStore.java:59
      note: "CorrelatedContextController receives POST /internal/v1/correlated-contexts, stores the receipt and a diagnosis_jobs row in one transaction and answers accepted/duplicate; it dispatches no command service."
  - id: DiagnosisQueryController
    name: DiagnosisQueryController
    package: interfaces.rest
    layer: interfaces
    stereotype: Controller
    status: proposed
    component_realized: diagnostic_api_component
    attributes: []
    methods:
      - {name: getDiagnosticOutput, parameters: [], returns: DiagnosticView, effect: read}
    ingress:
      architecture_relationship: rel_dashboard_diagnostic_api
      protocol: REST/HTTPS
    implementation:
      status: implemented
      evidence:
        - recommendation:src/main/java/com/pipesor/recommendation/diagnosis/interfaces/rest/IncidentDiagnosisController.java:18-28
      note: "IncidentDiagnosisController, GET /api/v1/incidents/{incidentId}/diagnosis; calls the query handler directly."
  - id: GenerateDiagnosisCommand
    name: GenerateDiagnosisCommand
    package: domain.model.commands
    layer: domain
    stereotype: Command
    status: proposed
    component_realized: diagnostic_orchestrator_component
    attributes:
