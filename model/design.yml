      - {suffix: b, title: outbound correlation evidence, elements: [CorrelationEvidence, NlpCaptureContext, NlpPipelineContext, NlpExecutionContext, NlpCommitContext]}
      - {suffix: c, title: log processing, elements: [LogEnvelope, ParsedTemplate, ProcessedLog]}
  - id: CD-11
    title: "CD-11 — RAG: knowledge chunks and SQLAlchemy records"
    kind: bounded_context
    container: rag_retrieval
    zoom_target: rag_retrieval
