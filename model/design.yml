# SSOT del diseño de clases. Las clases `proposed` siguen siendo propuesta; las `implemented` se
# transcriben del código en las revisiones de model/implementation_status.yml (DC-007).
model_version: 1.2.0
design_rules:
  max_nodes_per_diagram: 15
  source: [model/architecture.yml, model/domain.yml, model/implementation_status.yml, SRC_ADR_018]
  # Una entrada por contenedor descrito. recommendation_service conserva las reglas de la propuesta (CD-1..CD-3);
  # los demás contenedores solo aportan clases transcritas del código (status: implemented).
  containers:
    recommendation_service:
      language: Java
      framework: Spring Boot
      repository: recommendation
      base_package: com.pipesor.recommendation
      cqrs: logical
      persistence: postgresql_operational_store
      event_sourcing: false
      separate_read_write_databases: false
      autonomous_remediation: false
      github_access: read_only
      artifact_publisher: github_actions
      navigation_views: [c4_context, c4_container_processing, c4_component_diagnostic]
    pipeline_service:
      {language: Java, framework: Spring Boot, repository: pipeline, base_package: org.pipesor.pipeline,
       persistence: postgresql_operational_store, navigation_views: [c4_context, c4_container_processing]}
    ingestion_normalization_service:
      {language: Java, framework: Spring Boot, repository: ingestion, base_package: org.pipesor.ingestion,
       persistence: postgresql_operational_store, navigation_views: [c4_context, c4_container_processing]}
    log_event_service:
      {language: Java, framework: Spring Boot, repository: log_event, base_package: org.pipesor.logevent,
       persistence: postgresql_operational_store, navigation_views: [c4_context, c4_container_processing]}
    evidence_correlation_engine:
      {language: Java, framework: Spring Boot, repository: correlation, base_package: org.pipesor.correlation,
       persistence: postgresql_operational_store, navigation_views: [c4_context, c4_container_processing]}
    nlp_log_processor:
      {language: Python, framework: FastAPI, repository: nlp, base_package: pipesor_nlp_log_processor,
       persistence: none, navigation_views: [c4_context, c4_container_processing]}
    rag_retrieval:
      {language: Python, framework: FastAPI, repository: rag, base_package: pipesor_rag_retrieval,
       persistence: pgvector_knowledge_store, navigation_views: [c4_context, c4_container_processing]}

# Las clases compartidas se definen una sola vez. elements es la membresía exacta.
class_diagrams:
  - id: CD-1
    title: "CD-1 — Diagnostic API and CQRS"
    kind: component_design
    container: recommendation_service
    zoom_target: diagnostic_api_component
    elements:
      - DiagnosisCommandController
      - DiagnosisQueryController
      - GenerateDiagnosisCommand
      - GenerateDiagnosisCommandService
      - GenerateDiagnosisCommandServiceImpl
      - GetDiagnosisQuery
      - DiagnosisQueryService
      - DiagnosisQueryServiceImpl
      - DiagnosticView
      - DiagnosticOrchestrator
      - DiagnosisRepository
      - HumanReviewCommandController
      - HumanReviewQueryController
      - HumanReviewCommandService
      - HumanReviewQueryService
    notes:
      - "Commands return identifiers; queries compose projections without writes."
      - "Correlated context is received via REST/HTTPS; the architecture does not specify a URI."
      - "Review and query operations already derive from IA/ADR; no additional endpoints."
      - "The orchestrator and repository are detailed in CD-2; human review is detailed in CD-3."
    # A4 print parts (DC-007): together they keep every member and relationship of the figure.
    print_parts:
      - {suffix: a, title: diagnosis command side, elements: [DiagnosisCommandController, GenerateDiagnosisCommandService, GenerateDiagnosisCommand, GenerateDiagnosisCommandServiceImpl, DiagnosticOrchestrator, DiagnosisRepository]}
      - {suffix: b, title: diagnosis query contract, elements: [DiagnosisQueryController, DiagnosisQueryService, GetDiagnosisQuery, DiagnosisQueryServiceImpl]}
      - {suffix: c, title: diagnosis query projection, elements: [DiagnosisQueryServiceImpl, DiagnosticView, DiagnosisRepository]}
      - {suffix: d, title: human review entry points, elements: [HumanReviewCommandController, HumanReviewQueryController, HumanReviewCommandService, HumanReviewQueryService]}
  - id: CD-2
    title: "CD-2 — Diagnostic Orchestration, RAG and LLM"
    kind: component_design
    container: recommendation_service
    zoom_target: diagnostic_orchestrator_component
    elements:
      - DiagnosticOrchestrator
      - KnowledgeRetrievalPort
      - RagRetrievalHttpAdapter
      - DiagnosticLlmGateway
      - AzureOpenAiDiagnosticAdapter
      - LlmResponseTranslator
      - SanitizedDiagnosticContext
      - DiagnosticOutputComposer
      - Diagnosis
      - Recommendation
      - ProbableCause
      - DiagnosisRepository
      - JpaDiagnosisRepositoryAdapter
      - RagRetrievalExternal
      - AzureOpenAiExternal
    notes:
      - "DiagnosticOutputComposer realizes diagnostic_output_component within this figure."
      - "Only sanitized evidence, authorized context and RAG knowledge reach the gateway."
      - "Each diagnostic snapshot is immutable; DIAGNOSIS_READY requires a probable cause and a timestamp."
      - "Recommendations and links are inserted with the snapshot; logical IDs connect contexts."
    # A4 print parts (DC-007): together they keep every member and relationship of the figure.
    print_parts:
      - {suffix: a, title: RAG retrieval port and adapter, elements: [DiagnosticOrchestrator, KnowledgeRetrievalPort, RagRetrievalHttpAdapter, RagRetrievalExternal]}
      - {suffix: b, title: LLM gateway and Azure OpenAI adapter, elements: [DiagnosticOrchestrator, DiagnosticLlmGateway, SanitizedDiagnosticContext, AzureOpenAiDiagnosticAdapter, AzureOpenAiExternal, LlmResponseTranslator]}
      - {suffix: c, title: output composition, elements: [DiagnosticOrchestrator, DiagnosticOutputComposer, Diagnosis]}
      - {suffix: d, title: response translation and probable cause, elements: [LlmResponseTranslator, Diagnosis, ProbableCause]}
      - {suffix: e, title: snapshot persistence, elements: [JpaDiagnosisRepositoryAdapter, Diagnosis, Recommendation]}
      - {suffix: f, title: repository port, elements: [DiagnosticOrchestrator, DiagnosisRepository, JpaDiagnosisRepositoryAdapter]}
  - id: CD-3
    title: "CD-3 — Human Review and Diagnostic Governance"
    kind: component_design
    container: recommendation_service
    zoom_target: human_review_component
    elements:
      - HumanReviewCommandController
      - HumanReviewQueryController
      - RecordHumanReviewCommand
      - HumanReviewCommandService
      - HumanReviewCommandServiceImpl
      - HumanReviewQueryService
      - HumanReviewQueryServiceImpl
      - HumanReview
      - HumanReviewDecision
      - RiskClassificationService
      - HumanReviewRepository
      - JpaHumanReviewRepositoryAdapter
      - AuditTrailPort
      - PostgresAuditTrailAdapter
    notes:
      - "CONFIRMED validates; CORRECTED requires actualCause; REJECTED rejects without a validated alternative."
      - "PENDING is derived from the absence of a review; it is not persisted in HumanReview."
      - "Risk classification and critical marking require an approved policy; no invented thresholds."
      - "Cross-cutting auditing to audit.audit_events with sanitized metadata and correlation IDs."
    # A4 print parts (DC-007): together they keep every member and relationship of the figure.
    print_parts:
      - {suffix: a, title: review command, elements: [HumanReviewCommandController, HumanReviewCommandService, RecordHumanReviewCommand, HumanReviewCommandServiceImpl, RiskClassificationService]}
      - {suffix: b, title: audit trail, elements: [HumanReviewCommandServiceImpl, AuditTrailPort, PostgresAuditTrailAdapter]}
      - {suffix: c, title: review query contract, elements: [HumanReviewQueryController, HumanReviewQueryService, HumanReviewQueryServiceImpl]}
      - {suffix: d, title: review query projection, elements: [HumanReviewQueryServiceImpl, HumanReviewRepository, HumanReview]}
      - {suffix: e, title: review aggregate and persistence, elements: [HumanReviewCommandServiceImpl, HumanReview, HumanReviewDecision, HumanReviewRepository, JpaHumanReviewRepositoryAdapter]}
  - id: CD-4
    title: "CD-4 — Pipeline: Incident aggregate"
    kind: bounded_context
    container: pipeline_service
    zoom_target: pipeline_service
    elements:
      - Incident
      - IncidentDetails
      - IncidentLifecycle
      - ExecutionOutcome
      - VerificationExecution
      - IncidentAction
      - IncidentStatus
      - Severity
      - PipelineStage
      - IncidentStore
      - JpaIncidentStore
      - IncidentJpaEntity
      - IncidentRunJpaEntity
      - IncidentRunRole
      - GitHubRepository
    notes:
      - "Incident is the aggregate root; its value objects are Java records."
      - "Tables without a domain class (pipelines, executions, stages, grants, event receipts, incident_diagnoses) are not drawn."
    # A4 print parts (DC-007): together they keep every member and relationship of the figure.
    print_parts:
      - {suffix: a, title: root and its value objects, elements: [Incident, IncidentDetails, IncidentLifecycle, ExecutionOutcome]}
      - {suffix: b, title: transitions, elements: [Incident, VerificationExecution, IncidentAction]}
      - {suffix: c, title: enums and repository catalog, elements: [IncidentDetails, IncidentLifecycle, IncidentStatus, Severity, PipelineStage, GitHubRepository]}
      - {suffix: d, title: store port, elements: [IncidentStore, JpaIncidentStore, Incident]}
      - {suffix: e, title: JPA rows, elements: [JpaIncidentStore, IncidentJpaEntity, IncidentRunJpaEntity, IncidentRunRole]}
  - id: CD-5
    title: "CD-5 — Ingestion: GitHubConnection aggregate"
    kind: bounded_context
    container: ingestion_normalization_service
    zoom_target: ingestion_normalization_service
    elements:
      - GitHubConnection
      - ConnectionRoot
      - ConnectionGeneration
      - ConnectionAttempt
      - ConnectionOperation
      - ConnectionIdentity
      - SecretReference
      - StateDigest
      - GenerationState
      - AttemptPhase
      - OperationKind
      - OperationPhase
      - ConnectionRepository
      - JpaConnectionRepository
    notes:
      - "The entities are immutable records of ConnectionRecords, changed only through GitHubConnection."
      - "Not drawn: enums CleanupState, Result and Scope (ConnectionRecords.java:14-18) and the four ConnectionJpaEntities rows."
    # A4 print parts (DC-007): together they keep every member and relationship of the figure.
    print_parts:
      - {suffix: a, title: root record, elements: [GitHubConnection, ConnectionRoot]}
      - {suffix: b, title: repository, elements: [ConnectionRepository, JpaConnectionRepository, GitHubConnection]}
      - {suffix: c, title: generations, elements: [GitHubConnection, ConnectionGeneration]}
      - {suffix: d, title: generation and root value objects, elements: [ConnectionGeneration, GenerationState, SecretReference, ConnectionRoot, ConnectionIdentity]}
      - {suffix: e, title: authorization attempts, elements: [GitHubConnection, ConnectionAttempt]}
      - {suffix: f, title: attempt value objects, elements: [ConnectionAttempt, StateDigest, AttemptPhase, SecretReference]}
      - {suffix: g, title: credential operations, elements: [GitHubConnection, ConnectionOperation, OperationKind, OperationPhase]}
  - id: CD-6
    title: "CD-6 — Ingestion: CaptureReceipt aggregate and WorkflowObservation"
    kind: bounded_context
    container: ingestion_normalization_service
    zoom_target: ingestion_normalization_service
    elements:
      - CaptureReceipt
      - CaptureScope
      - WorkflowObservation
      - ObservationCaptureContext
      - ObservationPipeline
      - ObservationExecution
      - ObservationStage
      - ObservationFailure
      - ObservationEvidence
      - ObservationStageName
      - CaptureLedger
      - JpaCaptureLedger
    notes:
      - "CaptureReceipt.phase is a String in the code."
      - "Not drawn: sign-in, consent, admission and workflow-scope tables, written by JDBC adapters without domain classes."
    # A4 print parts (DC-007): together they keep every member and relationship of the figure.
    print_parts:
      - {suffix: a, title: receipt and scope, elements: [JpaCaptureLedger, CaptureReceipt, CaptureScope]}
      - {suffix: b, title: ledger port, elements: [CaptureLedger, JpaCaptureLedger]}
      - {suffix: c, title: prepared observation check, elements: [CaptureReceipt, WorkflowObservation]}
      - {suffix: d, title: observation persistence, elements: [JpaCaptureLedger, WorkflowObservation]}
      - {suffix: e, title: scope to capture context, elements: [CaptureScope, ObservationCaptureContext]}
      - {suffix: f, title: capture context and pipeline, elements: [WorkflowObservation, ObservationCaptureContext, ObservationPipeline]}
      - {suffix: g, title: execution and stages, elements: [WorkflowObservation, ObservationExecution, ObservationStage, ObservationStageName]}
      - {suffix: h, title: failure and evidence, elements: [WorkflowObservation, ObservationFailure, ObservationEvidence]}
  - id: CD-7
    title: "CD-7 — Log/Event: evidence registration without an aggregate"
    kind: bounded_context
    container: log_event_service
    zoom_target: log_event_service
    elements:
      - RegisterEvidenceHandler
      - EvidenceInput
      - EvidenceScope
      - EvidencePipelineStage
      - EvidenceIdentity
      - EvidenceStore
      - JdbcEvidenceStore
    notes:
      - "No aggregate or entity: the EvidenceInput command record carries the evidence.evidence_items row."
    # A4 print parts (DC-007): together they keep every member and relationship of the figure.
    print_parts:
      - {suffix: a, title: registration, elements: [RegisterEvidenceHandler, EvidenceInput, EvidenceStore, JdbcEvidenceStore]}
      - {suffix: b, title: evidence value objects, elements: [EvidenceInput, EvidenceScope, EvidencePipelineStage, EvidenceIdentity]}
  - id: CD-8
    title: "CD-8 — Correlation: CorrelationGroup aggregate"
    kind: bounded_context
    container: evidence_correlation_engine
    zoom_target: evidence_correlation_engine
    elements:
      - CorrelationGroup
      - CorrelationContext
      - CorrelationContribution
      - EvidenceSignal
      - ScopeEnvelope
      - CorrelationSourceLocator
      - DurableCorrelationStore
      - CorrelatedContextEntity
    notes:
      - "A group's evidenceIds are stored in correlated_contexts.evidence_ids; its revision is the size of the set."
    # A4 print parts (DC-007): together they keep every member and relationship of the figure.
    print_parts:
      - {suffix: a, title: group and contribution, elements: [CorrelationGroup, CorrelationContext, CorrelationContribution]}
      - {suffix: b, title: contribution value objects, elements: [CorrelationContribution, EvidenceSignal, ScopeEnvelope, CorrelationSourceLocator]}
      - {suffix: c, title: durable store, elements: [DurableCorrelationStore, CorrelationGroup, CorrelationContribution]}
      - {suffix: d, title: correlated context snapshot, elements: [DurableCorrelationStore, CorrelatedContextEntity]}
  - id: CD-9
    title: "CD-9 — Recommendation: implemented records against the proposed aggregates"
    kind: bounded_context
    container: recommendation_service
    zoom_target: recommendation_service
    summary_members: [Diagnosis, HumanReview, Recommendation]
    elements:
      - OrchestratorDiagnosis
      - OrchestratorHypothesis
      - OrchestratorEvidence
      - OrchestratorSource
      - OrchestratorModel
      - Diagnosis
      - Recommendation
      - ReviewRecord
      - ReviewSubmission
      - ReviewDecision
      - HumanReview
      - AdmittedContext
      - ReceiptSubmission
      - DiagnosisJob
      - SummaryClaim
    notes:
      - "The code has no aggregate root: diagnoses, reviews, receipts, jobs and outbox are records handled by JDBC stores."
      - "Proposed classes are shown without members; CD-2 and CD-3 detail them."
      - "Hypothesis.recommendation (String) stands in for the proposed Recommendation entity."
    # A4 print parts (DC-007): together they keep every member and relationship of the figure.
    print_parts:
      - {suffix: a, title: "diagnosis record, hypothesis and model", elements: [OrchestratorDiagnosis, OrchestratorHypothesis, OrchestratorModel, Diagnosis, Recommendation]}
      - {suffix: b, title: cited evidence and sources, elements: [OrchestratorDiagnosis, OrchestratorEvidence, OrchestratorSource]}
