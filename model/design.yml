      - {name: summary, type: String}
      - {name: correlationId, type: String}
      - {name: sanitizedPrioritizedEvidence, type: 'List<String>'}
    methods: []
    implementation:
      status: not_implemented
      reason: "No command record: the asynchronous worker claims DiagnosisJobs.Job and rebuilds AdmittedContext."
      evidence:
        - recommendation:src/main/java/com/pipesor/recommendation/diagnosis/application/ports/DiagnosisJobs.java:20
        - recommendation:src/main/java/com/pipesor/recommendation/diagnosis/application/model/AdmittedContext.java:10-11
  - id: GenerateDiagnosisCommandService
    name: GenerateDiagnosisCommandService
    package: application.internal.commandservices
    layer: application
    stereotype: CommandService
    kind: interface
    status: proposed
    component_realized: diagnostic_orchestrator_component
    attributes: []
    methods:
      - {name: handle, parameters: [{name: command, type: GenerateDiagnosisCommand}], returns: UUID, effect: write}
    implementation:
      status: not_implemented
      reason: No use-case interface; DiagnosisWorker calls DiagnoseAdmittedContextsHandler.runOnce().
  - id: GenerateDiagnosisCommandServiceImpl
    name: GenerateDiagnosisCommandServiceImpl
    package: application.internal.commandservices
    layer: application
    stereotype: CommandService
    status: proposed
    component_realized: diagnostic_orchestrator_component
    attributes: []
    methods:
