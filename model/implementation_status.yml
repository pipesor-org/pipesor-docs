# Solo referencia IDs existentes de model/architecture.yml y model/domain.yml. No crea, retira ni
# reinterpreta arquitectura, no cambia `status` ni `source` y no cierra preguntas abiertas ni PD:
# registra dónde está implementado cada hecho, o que no lo está, con evidencia repo:ruta:línea.
# Los generadores lo usan para marcar en cada diagrama lo implementado frente a lo propuesto.
