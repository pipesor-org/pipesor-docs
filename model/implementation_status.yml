# Observación de solo lectura del entorno desplegado (decisión 7). No es una aprobación de despliegue:
# deployment.mvp_preparation.deployment_authorized sigue en false en architecture.yml (ADR-019).
deployment_observation:
  environment: dev
  observed_at: "2026-11-27T22:07Z"
  method: "az containerapp list, az containerapp revision show, az containerapp job list, az postgres flexible-server show y az servicebus topic subscription list (solo lectura)"
  container_apps: "8 Container Apps Healthy (ingestion, pipeline, log-event, nlp, correlation, recommendation, rag, dashboard), una réplica, con los digests de environments/dev/images.json"
  jobs: "job-database-setup, job-ingestion-authority-import y job-rag-migrations (Manual)"
  postgresql: "pg-pipesor-dev-04f339b7, PostgreSQL 17, Standard_D2s_v3, detenido en el momento de la observación"
  service_bus: "topic workflow-evidence con las suscripciones pipeline, log-event y nlp"
  evidence:
    - "iac:environments/dev/images.json:1-62"

# Verificación estructural del dominio: el 27/11/2026 se aplicaron las migraciones reales con Flyway 12.4
# (33) y Alembic 1.20.1 (3) en PostgreSQL 17.12/pgvector 0.8.7 y se compararon por introspección con
# build/schema.sql + build/extras.sql generados desde domain.yml 1.11.0. Columnas, tipos, nulabilidad, PK,
# únicas, CHECK, FK y triggers coinciden salvo lo listado aquí como partial, divergent o not_implemented, ya
# registrado en DD-026, DD-027, DD-028 y DD-029. La evidencia de cada tabla es su CREATE TABLE.
domain_verification:
  date: "2026-11-27"
