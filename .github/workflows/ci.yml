name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conventions:
    uses: pipesor-org/pipesor-ci/.github/workflows/conventions.yml@df3b5fc08bc631912ff34be9154aa27776472754 # v1.0.0
    permissions:
      contents: read

  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.8'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: git diff --check
      - name: Validate architecture, domain and design models
        run: make PYTHON=python validate validate-domain validate_design
      - name: Validate presentation models
        run: make PYTHON=python validate-logical-expo validate-physical-expo validate-c4-expo

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.8'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Graphviz renderer
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends graphviz libgvplugin-neato-layout8 fonts-dejavu-core
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run unit tests
        run: make PYTHON=python test
