dth="507.039" height="149.688" fill="#DDD" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="43.047" y="550.351" fill="#000" font-size="12" textLength="462.152" font-family="DejaVu Sans">Logical CQRS / same PostgreSQL instance / dependencies through interfaces</text><text x="43.047" y="564.32" fill="#000" font-size="12" textLength="446.467" font-family="DejaVu Sans">Commands return identifiers; queries compose projections without writes.</text><text x="43.047" y="578.289" fill="#000" font-size="12" textLength="487.131" font-family="DejaVu Sans">Correlated context is received via REST/HTTPS; the architecture does not specify</text><text x="43.047" y="592.257" fill="#000" font-size="12" textLength="35.643" font-family="DejaVu Sans">a URI.</text><text x="43.047" y="606.226" fill="#000" font-size="12" textLength="497.039" font-family="DejaVu Sans">Review and query operations already derive from IA/ADR; no additional endpoints.</text><text x="43.047" y="620.195" fill="#000" font-size="12" textLength="474.967" font-family="DejaVu Sans">The orchestrator and repository are detailed in CD-2; human review is detailed</text><text x="43.047" y="634.164" fill="#000" font-size="12" textLength="48.152" font-family="DejaVu Sans">in CD-3.</text><text x="43.047" y="648.132" fill="#000" font-size="12" textLength="73.4" font-family="DejaVu Sans">Fill by layer:</text><text x="124.076" y="648.132" fill="#000" font-size="12" textLength="59.771" font-family="DejaVu Sans" filter="url(#b2fjxjjhbd98s0)">interfaces</text><text x="187.662" y="648.132" fill="#000" font-size="12" font-family="DejaVu Sans"> </text><text x="195.291" y="648.132" fill="#000" font-size="12" textLength="66.193" font-family="DejaVu Sans" filter="url(#b2fjxjjhbd98s1)">application</text><text x="265.299" y="648.132" fill="#000" font-size="12" font-family="DejaVu Sans"> </text><text x="272.928" y="648.132" fill="#000" font-size="12" textLength="44.941" font-family="DejaVu Sans" filter="url(#b2fjxjjhbd98s2)">domain</text><text x="43.047" y="662.101" fill="#000" font-size="12" textLength="213.563" font-family="DejaVu Sans">Code status: plain = implemented ·</text><text x="260.424" y="662.101" fill="#B26A00" font-size="12" textLength="43.248" font-weight="700" font-family="DejaVu Sans">amber</text><text x="307.487" y="662.101" fill="#000" font-size="12" textLength="130.084" font-family="DejaVu Sans">= partial or divergent</text><text x="43.047" y="676.07" fill="#C62828" font-size="12" textLength="75.926" font-weight="700" font-family="DejaVu Sans">red dashed</text><text x="122.787" y="676.07" fill="#000" font-size="12" textLength="124.705" font-family="DejaVu Sans">= not implemented ·</text><text x="251.307" y="676.07" fill="#6B7280" font-size="12" textLength="70.189" font-family="DejaVu Sans">gray dotted</text><text x="325.311" y="676.07" fill="#000" font-size="12" textLength="63.668" font-family="DejaVu Sans">= external</text></g></g></svg>