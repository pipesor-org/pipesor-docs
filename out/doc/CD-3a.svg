ont-size="12" textLength="232.793" font-family="DejaVu Sans">+isCritical(Recommendation): boolean</text><line x1="319.12" y1="286.59" x2="561.913" y2="286.59" style="stroke:#C62828;stroke-width:1;"/><text x="324.12" y="301.729" fill="#000" font-size="12" textLength="225.012" font-style="italic" font-family="DejaVu Sans">Critical marking follows the approved</text><text x="324.12" y="315.697" fill="#000" font-size="12" textLength="188.807" font-style="italic" font-family="DejaVu Sans">policy; does not derive incident</text><text x="324.12" y="329.666" fill="#000" font-size="12" textLength="48.193" font-style="italic" font-family="DejaVu Sans">severity</text></g><!--link HumanReviewCommandController to HumanReviewCommandService--><!--link HumanReviewCommandController to HumanReviewCommandService--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk8" data-source-line="57" data-link-type="dependency"><path d="M162.33,166.116 C162.4,169.036 162.47,171.936 162.52,174.746 C162.78,189.286 162.505,200.104 161.685,214.444" style="stroke:#C62828;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="HumanReviewCommandController-to-HumanReviewCommandService-1" codeLine="57"/><polygon points="161.4,219.436,165.907,210.679,161.685,214.444,157.92,210.223,161.4,219.436" fill="#C62828" style="stroke:#C62828;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="163.58" y="186.885" fill="#000" font-size="12" textLength="103.658" font-family="DejaVu Sans">review command</text></g><!--link HumanReviewCommandService to RecordHumanReviewCommand--><!--link HumanReviewCommandService to RecordHumanReviewCommand--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk10" data-source-line="59" data-link-type="dependency"><path d="M157.52,315.966 C157.52,332.196 157.52,345.886 157.52,364.176" style="stroke:#C62828;stroke-width:1;stroke-dasharray:7,7;" fill="none" id="HumanReviewCommandService-to-RecordHumanReviewCommand-1" codeLine="59"/><pol