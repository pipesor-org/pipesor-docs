ze="12" textLength="462.152" font-family="DejaVu Sans">Logical CQRS / same PostgreSQL instance / dependencies through interfaces</text><text x="54.662" y="592.26" fill="#000" font-size="12" textLength="516.393" font-family="DejaVu Sans">CONFIRMED validates; CORRECTED requires actualCause; REJECTED rejects without a</text><text x="54.662" y="606.229" fill="#000" font-size="12" textLength="128.619" font-family="DejaVu Sans">validated alternative.</text><text x="54.662" y="620.197" fill="#000" font-size="12" textLength="424.072" font-family="DejaVu Sans">PENDING is derived from the absence of a review; it is not persisted in</text><text x="54.662" y="634.166" fill="#000" font-size="12" textLength="90.445" font-family="DejaVu Sans">HumanReview.</text><text x="54.662" y="648.135" fill="#000" font-size="12" textLength="475.049" font-family="DejaVu Sans">Risk classification and critical marking require an approved policy; no invented</text><text x="54.662" y="662.104" fill="#000" font-size="12" textLength="66.844" font-family="DejaVu Sans">thresholds.</text><text x="54.662" y="676.072" fill="#000" font-size="12" textLength="439.131" font-family="DejaVu Sans">Cross-cutting auditing to audit.audit_events with sanitized metadata and</text><text x="54.662" y="690.041" fill="#000" font-size="12" textLength="91.523" font-family="DejaVu Sans">correlation IDs.</text><text x="54.662" y="704.01" fill="#000" font-size="12" textLength="73.4" font-family="DejaVu Sans">Fill by layer:</text><text x="135.691" y="704.01" fill="#000" font-size="12" textLength="59.771" font-family="DejaVu Sans" filter="url(#b1stuyth4h3dii0)">interfaces</text><text x="199.277" y="704.01" fill="#000" font-size="12" font-family="DejaVu Sans"> </text><text x="206.906" y="704.01" fill="#000" font-size="12" textLength="66.193" font-family="DejaVu Sans" filter="url(#b1stuyth4h3dii1)">application</text><text x="276.914" y="704.01" fill="#000" font-size="12" font-family="DejaVu Sans"> </text><text x="284.543" y="704.01" fill="#000" font-size="12" textLength="44.941" font-family="DejaVu Sans" filter="url(#b1stuyth4h3dii2)">domain</text><text x="54.662" y="717.979" fill="#000" font-size="12" textLength="213.563" font-family="DejaVu Sans">Code status: plain = implemented ·</text><text x="272.039" y="717.979" fill="#B26A00" font-size="12" textLength="43.248" font-weight="700" font-family="DejaVu Sans">amber</text><text x="319.101" y="717.979" fill="#000" font-size="12" textLength="130.084" font-family="DejaVu Sans">= partial or divergent</text><text x="54.662" y="731.947" fill="#C62828" font-size="12" textLength="75.926" font-weight="700" font-family="DejaVu Sans">red dashed</text><text x="134.402" y="731.947" fill="#000" font-size="12" textLength="124.705" font-family="DejaVu Sans">= not implemented ·</text><text x="262.922" y="731.947" fill="#6B7280" font-size="12" textLength="70.189" font-family="DejaVu Sans">gray dotted</text><text x="336.926" y="731.947" fill="#000" font-size="12" textLength="63.668" font-family="DejaVu Sans">= external</text></g></g></svg>